<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ethixo — Teacher view (pilot)</title>
<style>
  /* Tokens and teacher-dashboard component rules are copied from index.html (Sharon Lim dashboard) so the pilot dashboard looks the same. */
  :root{
    --brand:#00A86B; --brand-dark:#00875A; --brand-deep:#046B4A;
    --brand-light:#E3F5EC; --brand-light-b:#BFE9D4;
    --ink:#182420; --muted:#5E6D66;
    --amber:#C9821F; --amber-bg:#FBF0DE;
    --bg:#EAEAEA; --card:#FFFFFF; --border:#DBDFDC; --panel:#E2E4E2;
    --radius:18px; --shadow:0 4px 18px rgba(24,36,32,.07);
  }
  *{box-sizing:border-box} body{margin:0;font-family:Montserrat,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);}
  main{max-width:920px;margin:0 auto;padding:24px 16px;}
  h1{font-size:22px;margin:0 0 4px} .muted{color:var(--muted);font-size:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin:16px 0;}
  input,select{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;}
  button{padding:10px 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer;}
  button.link{background:none;color:var(--brand-deep);padding:0;font-weight:500}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);}
  .code{font-family:ui-monospace,monospace;font-size:18px;letter-spacing:1px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* ---- copied from index.html ---- */
.dash-shell{--ds-xs:10px; --ds-sm:20px; --ds-md:30px; --ds-lg:44px; --card-shadow:0 1px 2px rgba(24,36,32,.04),0 10px 28px -10px rgba(24,36,32,.12); --card-radius:22px;}
.noticed-card-refined{background:linear-gradient(155deg,var(--brand-light),#fff 78%);border:1px solid var(--brand-light-b);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:30px 32px;margin-bottom:var(--ds-md);}
.t-acard-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:var(--ds-md);}
.t-acard{background:#fff;border:1px solid var(--border);border-left:5px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--card-shadow);}
.t-acard-new{border-left-color:#C1665A;}
.t-acard-progress{border-left-color:var(--amber);}
.t-acard-done{border-left-color:var(--brand-deep);}
.t-acard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.t-acard-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.t-astatus2{flex:none;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;}
.t-astatus2-new{background:#F7E4E1;color:#9B4A3F;}
.t-astatus2-progress{background:var(--amber-bg);color:#8a5c14;}
.t-astatus2-done{background:var(--brand-light);color:var(--brand-deep);}
.t-astatus2-needs{background:#E3EEFB;color:#1D5A9E;}
.t-areport-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:var(--ds-md);}
.t-areport{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--card-shadow);}
.t-areport-class{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.t-areport-lesson{font-size:16px;font-weight:800;color:var(--ink);margin-top:2px;}
.t-areport-due{font-size:12.5px;color:var(--muted);margin-top:2px;margin-bottom:12px;}
.t-areport-rows{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:9px;}
.t-areport-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;}
.t-areport-name{color:var(--ink);font-weight:700;}
.t-areport-name.live{color:var(--brand-deep);}
.t-areport-status-frac{display:flex;align-items:center;gap:8px;flex:none;}
.t-areport-frac{color:var(--muted);font-size:12px;font-weight:700;}
.t-acard-lesson{font-size:16px;font-weight:800;color:var(--ink);}
.t-acard-due{font-size:13px;color:var(--muted);margin-top:4px;}
.noticed-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.noticed-head .nh-badge{width:48px;height:48px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(0,168,107,.3);}
.noticed-head h3{margin:0;font-size:19px;font-weight:800;color:var(--brand-deep);}
.noticed-list{display:flex;flex-direction:column;gap:2px;}
.noticed-item-refined{display:flex;align-items:flex-start;gap:13px;padding:12px 0;font-size:16px;color:var(--muted);line-height:1.5;border-top:1px solid rgba(4,107,74,.09);}
.noticed-item-refined:first-child{border-top:none;}
.noticed-item-refined .ni-mark{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-light-b);color:var(--brand-deep);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.noticed-item-refined.new{color:var(--brand-deep);font-weight:700;}
.noticed-item-refined.new .ni-mark{background:var(--brand);color:#fff;}
.noticed-item-refined .ni-badge{flex:none;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:20px;margin-left:auto;text-transform:uppercase;}
.growth-card{border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:26px 24px 24px;border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;}
.growth-card.tint-green{background:var(--brand-light);border-color:var(--brand-light-b);}
.growth-card.tint-blue{background:#E3EEFB;border-color:#c7ddf5;}
.growth-card.tint-amber{background:var(--amber-bg);border-color:#efd6a4;}
.growth-card .gc-icon{width:56px;height:56px;border-radius:15px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.growth-card.tint-green .gc-icon{color:var(--brand-deep);}
.growth-card.tint-blue .gc-icon{color:#1D5A9E;}
.growth-card.tint-amber .gc-icon{color:#8a5c14;}
.growth-card .gc-number{font-size:40px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.5px;}
.growth-card .gc-label{font-size:17px;color:var(--ink);font-weight:600;margin:8px 0 18px;line-height:1.35;}
.growth-card a.gc-view{font-size:14px;font-weight:700;color:var(--brand-deep);text-decoration:none;margin-top:auto;}
.growth-card a.gc-view:hover{text-decoration:underline;}
.examready-card-refined{background:linear-gradient(155deg,#FFF9EC,#fff 70%);border:1px solid #f3e3bd;border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:30px 32px;margin-bottom:var(--ds-md);}
.examready-card-refined .er-head{display:flex;align-items:center;gap:14px;margin-bottom:5px;}
.examready-card-refined .er-head .er-badge{width:48px;height:48px;border-radius:14px;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(201,130,31,.3);}
.examready-card-refined h3{margin:0;font-size:19px;font-weight:800;color:#8a5c14;}
.examready-card-refined p.hint{margin:5px 0 20px;color:var(--ink);opacity:.65;font-size:14.5px;}
.er-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.65);margin-bottom:9px;}
.er-row .er-icon{flex:none;width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;}
.er-row .er-icon.icon-EN{color:var(--brand-deep);}
.er-row .er-icon.icon-SCI{color:#1D5A9E;}
.er-row .er-icon.icon-SS{color:#8a5c14;}
.er-row .er-name{flex:1;font-size:15.5px;font-weight:700;color:var(--ink);}
.er-row .er-count{font-size:20px;font-weight:800;color:#8a5c14;}
.examready-card-refined a.er-viewall{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px 20px;border-radius:13px;font-size:15px;font-weight:700;color:#8a5c14;background:#fff;border:1.5px solid #f0dbae;text-decoration:none;transition:background .12s,border-color .12s;}
.examready-card-refined a.er-viewall:hover{background:var(--amber-bg);border-color:var(--amber);}
.t-section-title{margin:var(--ds-lg) 0 14px;font-size:17px;font-weight:800;color:var(--ink);}
.class-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--ds-lg);}
.class-tab{border:1.5px solid var(--border);background:#fff;color:var(--muted);border-radius:11px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
.class-tab:hover{border-color:var(--brand);color:var(--ink);}
.class-tab.active{background:var(--brand);color:#fff;border-color:var(--brand-dark);}
.growth-card.tint-purple{background:#EFE9FA;border-color:#D9CBF2;}
.growth-card.tint-purple .gc-icon{color:#6B4FA0;}
.t-progress-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--ds-sm);margin-bottom:var(--ds-md);}
@media(max-width:900px){.t-progress-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.t-progress-grid{grid-template-columns:1fr;}}
.t-encourage-wrap{margin-bottom:var(--ds-md);}
.t-encourage-hint{margin:0 0 14px;color:var(--muted);font-size:14px;}
.t-encourage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--ds-sm);}
@media(max-width:760px){.t-encourage-grid{grid-template-columns:1fr;}}
.t-encourage-card{border-radius:var(--card-radius);box-shadow:var(--card-shadow);border:1px solid var(--border);padding:20px 20px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s;background:#fff;}
.t-encourage-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,36,32,.12);}
.t-encourage-name{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.t-encourage-status{font-size:12px;font-weight:700;color:var(--brand-deep);background:var(--brand-light);display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
.t-encourage-focus{font-size:14px;color:var(--muted);}
.t-insights-card{background:linear-gradient(155deg,#E3EEFB,#fff 70%);border:1px solid #c7ddf5;border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:30px 32px;margin-bottom:var(--ds-md);}
.t-insights-card .t-head{display:flex;align-items:center;gap:14px;margin-bottom:5px;}
.t-insights-card .t-badge{width:48px;height:48px;border-radius:14px;background:#1D5A9E;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(29,90,158,.3);}
.t-insights-card h3{margin:0;font-size:19px;font-weight:800;color:#1D5A9E;}
.t-insights-card p.hint{margin:5px 0 20px;color:var(--ink);opacity:.65;font-size:14.5px;}
.t-misc-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:13px;background:rgba(255,255,255,.65);margin-bottom:9px;}
.t-misc-title{font-size:14.5px;font-weight:700;color:var(--ink);}
.t-misc-meta{font-size:13px;font-weight:700;color:#1D5A9E;white-space:nowrap;margin-left:14px;}
.t-er-counts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.t-er-counts .t-er-frac{font-size:16px;font-weight:800;color:#8a5c14;white-space:nowrap;}
.t-er-counts .t-er-frac b{font-size:20px;font-weight:800;}
.t-er-counts .t-er-caption{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;}
.t-detail-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);font-size:15px;}
.t-detail-row .t-detail-label{color:var(--muted);font-weight:600;}
.t-detail-row .t-detail-val{color:var(--ink);font-weight:700;text-align:right;}
.t-workspace-context{margin-bottom:16px;}
.t-workspace-chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;padding:7px 14px;border-radius:20px;}
.teacher-hero-card{position:relative;border-radius:22px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px rgba(24,36,32,.06),0 20px 40px -16px rgba(14,58,38,.22);background:#EAF3EC;height:400px;}
.teacher-hero-img-wrap{position:absolute;inset:0;}
.teacher-hero-img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 50%;}

.teacher-hero-text{position:absolute;left:5%;top:12%;max-width:27%;}
.teacher-hero-text svg{display:block;margin-bottom:10px;}
.teacher-hero-text h1{margin:0 0 7px;font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.3px;line-height:1.22;}

@media(max-width:820px){.teacher-hero-card{height:320px;}.teacher-hero-text{max-width:32%;top:10%;}.teacher-hero-text h1{font-size:18px;}.teacher-hero-text p{font-size:12.5px;}}
@media(max-width:560px){
    .teacher-hero-card{height:auto;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(24,36,32,.06),0 12px 26px -14px rgba(14,58,38,.16);}
    .teacher-hero-text{position:static;max-width:none;padding:16px 18px;order:1;background:#fff;display:flex;align-items:center;gap:13px;}
    .teacher-hero-text svg{flex:none;margin-bottom:0;}
    .teacher-hero-copy{min-width:0;}
    .teacher-hero-text h1{font-size:16.5px;}
    .teacher-hero-text p{font-size:12px;}
    .teacher-hero-img-wrap{position:relative;height:150px;order:2;}

    .teacher-hero-img{object-position:center 55%;}
  }
.growth-card.t-clickable{cursor:pointer;transition:transform .12s,box-shadow .12s;}
.growth-card.t-clickable:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,36,32,.12);}
.t-tap-hint{font-size:12px;font-weight:700;color:var(--brand-deep);margin-top:10px;opacity:.85;}
.t-insight-banner{background:var(--brand-light);border:1px solid var(--brand-light-b);border-radius:14px;padding:16px 18px;font-size:14.5px;font-weight:600;color:var(--brand-deep);margin-bottom:20px;}
  /* ---- copied buttons/forms/detail rows from index.html ---- */
  .center{text-align:center;}
  .btn{border:none;border-radius:12px;padding:13px 22px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Montserrat',sans-serif;transition:.15s;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06);}
  .btn-outline{background:#fff;border:1.5px solid var(--brand);color:var(--brand-deep);}
  .btn-outline:hover:not(:disabled){background:var(--brand-light);}

  .qmeta{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .assign-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:'Montserrat',sans-serif;font-size:14.5px;background:#fff;color:var(--ink);}
  .assign-input:disabled{background:var(--panel);color:var(--muted);}
  .learned-item{display:flex;gap:8px;padding:6px 0;font-size:14px;color:var(--ink);}
  .learned-item::before{content:"✓";color:var(--brand-deep);font-weight:800;flex:none;}
  .detail-item{border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:11px;}

  label.field{font-weight:700;color:var(--ink);font-size:13.5px;display:block;margin:16px 0 6px;}

  .t-misc-title{min-width:0;overflow-wrap:anywhere;}
  @media(max-width:560px){.t-misc-row{flex-direction:column;align-items:flex-start;gap:6px;}.t-misc-meta{margin-left:0;text-align:left;}}
  .t-misc-row.t-clickable{cursor:pointer;} .t-misc-row.t-clickable:hover{background:rgba(255,255,255,.6);}
  .t-chip{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;background:var(--brand-light);color:var(--brand-deep);}

<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="assets/pilot-teacher-insights.js"></script>
<script>
/* ETHIXO-TEACHER-CONFIG-BEGIN
   PLACEHOLDERS ONLY in committed code. Real values are filled in at request time by api/pilot-app.js, and only on an
   allow-listed, non-Production pilot host (served at /pilot-teacher). Opened anywhere else, this page stays inert. */
const SUPABASE_URL = "__SET_ME__";
const SUPABASE_PUBLISHABLE_KEY = "__SET_ME__";
const DB_SYNC_ALLOWED_HOSTS = [];
/* ETHIXO-TEACHER-CONFIG-END */

/* Pilot teacher dashboard: READ-ONLY.
   - Separate sign-in (email link) and separate session storage from the student app.
   - Reads ONLY: own profile, own classes and class_members/profiles of own class (RLS), teacher_attempt_summary() — scores, counts,
     timestamps, thinking-help flag — and the static assets/pilot-lesson-meta.json (lesson titles + max marks, no questions/answers). No raw attempts, answers, feedback or ScholarVault content exist in this view, and RLS gives
     teachers no access to those tables.
   - Writes ONLY: create_my_profile('teacher', name) once (unapproved by default; approval is an operator step). */
const LIB = "assets/vendor/supabase-js-2.117.2.umd.js";
const app = document.getElementById("app");
let client = null, view = { classes: [], rows: [], members: [], assignments: [], tab: "overview", page: "dash", studentId: null, msg: "" };

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function show(html){ app.innerHTML = html; }
function configured(){
  return /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SUPABASE_URL) && /^sb_publishable_/.test(SUPABASE_PUBLISHABLE_KEY)
    && DB_SYNC_ALLOWED_HOSTS.indexOf(location.hostname.toLowerCase()) !== -1;
}
function loadLib(){
  return new Promise((resolve, reject) => {
    if (window.supabase && window.supabase.createClient) return resolve(window.supabase);
    const s = document.createElement("script"); s.src = LIB;
    s.onload = () => window.supabase ? resolve(window.supabase) : reject(new Error("lib"));
    s.onerror = () => reject(new Error("lib")); document.head.appendChild(s);
  });
}

async function boot(){
  if (!configured()) { show('<h1>Teacher view</h1><p class="muted">The teacher view is not available on this address.</p>'); return; }
  try {
    const lib = await loadLib();
    client = lib.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: {
      persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce", storageKey: "ethixoTeacherAuth" } });
    await route();
  } catch (e) { show('<h1>Teacher view</h1><p class="muted">Could not load. Please refresh the page.</p>'); }
}

async function route(){
  const { data } = await client.auth.getSession();
  const user = data && data.session ? data.session.user : null;
  if (!user || user.is_anonymous) return signInScreen();
  const p = await client.from("profiles").select("id,role,display_name,is_approved").eq("id", user.id).maybeSingle();
  if (p.error) return show('<p class="muted">Could not load your profile. Please refresh.</p>' + signOutLink());
  if (!p.data) return nameScreen(user.email);
  if (p.data.role !== "teacher") return show('<h1>Teacher view</h1><p>This account is not a teacher account.</p>' + signOutLink());
  if (!p.data.is_approved) return show('<h1>Thanks, ' + esc(p.data.display_name) + '</h1><p>Your teacher account is waiting for approval by Ethixo. Please check back later.</p>' + signOutLink());
  return dashboard(p.data);
}

function signOutLink(){ return '<p><button class="link" onclick="signOut()">Sign out</button></p>'; }
async function signOut(){ try { await client.auth.signOut(); } catch (e) {} location.replace(location.pathname); }

function signInScreen(msg){
  show('<h1>Ethixo — Teacher view</h1><p class="muted">Pilot. Sign in with your school email; we will email you a sign-in link.</p>' +
    '<div class="card"><div class="row"><input id="email" type="email" placeholder="you@school.edu.sg" style="flex:1 1 260px">' +
    '<button onclick="sendLink()">Email me a link</button></div>' + (msg ? '<p class="muted">' + esc(msg) + '</p>' : '') + '</div>');
}
async function sendLink(){
  const email = String(document.getElementById("email").value).trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return signInScreen("Please enter a valid email address.");
  const r = await client.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
  signInScreen(r.error ? "Could not send the link. Please try again in a minute." : "Check your inbox and open the link on this device and browser.");
}

function nameScreen(email, msg){
  show('<h1>Welcome</h1><p class="muted">Signed in as ' + esc(email) + '. Enter the name students and Ethixo will see.</p>' +
    '<div class="card"><div class="row"><input id="tname" maxlength="40" placeholder="e.g. Ms Tan" style="flex:1 1 220px">' +
    '<button onclick="createTeacher()">Continue</button></div>' + (msg ? '<p class="muted">' + esc(msg) + '</p>' : '') + '</div>' + signOutLink());
}
async function createTeacher(){
  const name = String(document.getElementById("tname").value).trim();
  if (!name || name.length > 40) return nameScreen("", "Please enter a name (up to 40 characters).");
  const r = await client.rpc("create_my_profile", { p_role: "teacher", p_display_name: name, p_level: null });
  if (r.error) return nameScreen("", "Could not save. Please try again.");
  route();
}

/* ---- Pilot Teacher Dashboard: same layout and navigation as the Sharon Lim demo dashboard in index.html, fed ONLY by
   teacher_attempt_summary() + own classes/roster/assignments + lesson-meta (titles, marks, curriculum prompts; never answers).
   Signal rules: assets/pilot-teacher-insights.js (printed in "How these signals work"). ---- */
let META = null;
const WS_LEVEL = "P6"; // the pilot is P6-only (assignments are created for P6 lessons)
async function dashboard(profile){
  view.profile = profile; view.page = "dash"; view.tab = view.tab || "overview"; view.studentId = null; view.metric = null; view.lessonKey = null; view.assignMsg = "";
  if (!META) { try { const r = await fetch("assets/pilot-lesson-meta.json"); META = r.ok ? await r.json() : {}; } catch (e) { META = {}; } }
  await loadAll();
}
async function loadAll(){
  view.msg = "";
  const c = await client.from("classes").select("id,name,join_code,created_at").order("created_at");
  view.classes = c.error ? [] : (c.data || []);
  view.rows = []; view.members = []; view.assignments = [];
  if (view.classes.length) {
    const r = await client.rpc("teacher_attempt_summary", {});
    if (r.error) view.msg = "Could not load progress. Please refresh."; else view.rows = r.data || [];
    try {
      const m = await client.from("class_members").select("student_id,class_id");
      const ids = Array.from(new Set((m.data || []).map(x => x.student_id)));
      if (ids.length) {
        const p = await client.from("profiles").select("id,display_name").in("id", ids);
        const names = new Map((p.data || []).map(x => [x.id, x.display_name]));
        view.members = (m.data || []).map(x => ({ student_id: x.student_id, class_id: x.class_id, display_name: names.get(x.student_id) || "Student" }));
      }
    } catch (e) { view.members = []; }
    try { const a = await client.from("assignments").select("id,class_id,level,subject_key,lesson_id,due_date,created_at").order("created_at", { ascending: false }); view.assignments = a.error ? [] : (a.data || []); } catch (e) { view.assignments = []; }
  }
  if (view.tab !== "overview" && !view.classes.some(c => c.id === view.tab)) view.tab = "overview";
  recompute(); renderDashboard();
}
function recompute(){ view.ins = PilotInsights.compute(view.rows, view.members, META || {}, Date.now(), { classId: view.tab, assignments: view.assignments }); }
function setTab(id){ view.tab = id; view.page = "dash"; recompute(); renderDashboard(); }
function nav(page, extra){ Object.assign(view, { page: page }, extra || {}); renderDashboard(); window.scrollTo(0, 0); }
function openStudent(id){ nav("student", { studentId: id }); }
function openMetric(m){ nav("metric", { metric: m }); }
function openLesson(k){ nav("lesson", { lessonKey: k }); }
function backToDash(){ nav("dash"); }
function fmtDate(ms){ if (ms == null) return "–"; const d = new Date(ms); return isNaN(d) ? "–" : d.toLocaleString("en-SG", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function fmtDue(iso){ if (!iso) return ""; const p = String(iso).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso; }
function greeting(){ const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function className(id){ const c = view.classes.find(x => x.id === id); return c ? c.name : ""; }
function chipClass(s){ return s.performance === "Doing well" ? "" : s.performance === "May need attention" ? "warn" : s.performance === "Making progress" ? "blue" : s.performance === "Just getting started" ? "amber" : "grey"; }
function statusChips(s){ return '<span class="t-chip ' + chipClass(s) + '">' + esc(s.performance) + '</span>' + (s.thinkingHeavy ? ' <span class="t-chip amber">Relies on Thinking Help</span>' : ''); }
function studentMeta(s){
  if (!s.questions) return 'Joined · no practice yet';
  return s.questions + ' question' + (s.questions === 1 ? '' : 's') + ' · ' + s.lessonsPractised + ' lesson' + (s.lessonsPractised === 1 ? '' : 's') +
    (s.avgPct != null ? ' · best-attempt avg ' + s.avgPct + '%' : '') + ' · Thinking Help ' + s.thinkingQs + '/' + s.questions + ' · last active ' + fmtDate(s.lastAt);
}
function encourageCard(s){
  const f = s.focusLesson;
  return '<div class="t-encourage-card" onclick="openStudent(\'' + esc(s.id) + '\')"><div class="t-encourage-name">' + esc(s.name) + '</div>' +
    '<div class="t-encourage-status">' + esc(s.performance) + (s.thinkingHeavy ? ' · Thinking Help' : '') + '</div>' +
    '<div class="t-encourage-focus">' + esc(f ? f.title : studentMeta(s)) + '</div></div>';
}
const ASTATUS = { "Not Started": "t-astatus2-new", "In Progress": "t-astatus2-progress", "Needs Practice": "t-astatus2-needs", "Completed": "t-astatus2-done" };

function header(){ return '<div class="row" style="justify-content:space-between"><div class="muted">' + esc(view.profile.display_name) + ' · pilot</div>' + signOutLink() + '</div>'; }
function backBtn(label){ return '<button class="btn btn-ghost" style="margin-top:20px" onclick="backToDash()">' + (label || "Back to Dashboard") + '</button>'; }

function renderDashboard(){
  const top = header();
  if (!view.classes.length) return show(top + '<div class="card"><p>No class yet. Ethixo will set up your class and you will see its class code here.</p></div>');
  const d = view.ins;
  if (view.page === "student") { const s = d.students.find(x => x.id === view.studentId); if (s) return show(top + studentDetail(s)); }
  if (view.page === "metric" && d.metrics[view.metric]) return show(top + metricDetail(view.metric, d));
  if (view.page === "lesson") { const l = d.lessons.find(x => x.key === view.lessonKey); if (l) return show(top + lessonDetail(l, d)); }
  if (view.page === "assign") return show(top + assignScreen());
  return show(top + mainDashboard(d));
}

function mainDashboard(d){
  const cls = view.tab === "overview" ? null : view.classes.find(c => c.id === view.tab);
  const label = cls ? cls.name : "All classes";
  const R = d.rules;
  const tabs = '<div class="class-tabs"><button class="class-tab' + (view.tab === "overview" ? " active" : "") + '" onclick="setTab(\'overview\')">Overview</button>' +
    view.classes.map(c => '<button class="class-tab' + (view.tab === c.id ? " active" : "") + '" onclick="setTab(\'' + esc(c.id) + '\')">' + esc(c.name) + '</button>').join("") + '</div>';
  const heroSub = d.joined === 0 ? "Share the class code below to get your students started."
    : d.active + " of " + d.joined + " student" + (d.joined === 1 ? "" : "s") + " practising so far" + (cls ? " in " + cls.name : "") + ".";
  const cards = [
    { icon: "leaf", tint: "green", val: d.totals.newIdeas, label: "New ideas understood", metric: "newIdeas" },
    { icon: "bulb", tint: "blue", val: d.totals.corrected, label: "Misconceptions corrected", metric: "misconceptionsCorrected" },
    { icon: "star", tint: "amber", val: d.totals.full, label: "Exam-ready answers (full marks)", metric: null },
    { icon: "brain", tint: "purple", val: d.totals.fullNoThinking, label: "Full marks without Thinking Help", metric: "fullNoThinking" },
  ].map(c => '<div class="growth-card tint-' + c.tint + (c.metric ? ' t-clickable" onclick="openMetric(\'' + c.metric + '\')' : '') + '"><div class="gc-icon">' + dicon(c.icon, 26) + '</div><div class="gc-number">' + esc(c.val) + '</div><div class="gc-label">' + esc(c.label) + '</div>' +
    (c.metric ? '<div class="t-tap-hint">Tap to see what\'s behind this →</div>' : '') + '</div>').join("");
  const noticed = d.noticed.length ? d.noticed.map(n => '<div class="noticed-item-refined"><span class="ni-mark">✓</span><span>' + esc(n) + '</span></div>').join("")
    : '<div class="noticed-item-refined"><span class="ni-mark">✓</span><span>Nothing to show yet. Insights appear as students practise.</span></div>';
  const attn = d.attention.length ? d.attention.map(encourageCard).join("") : '<p class="muted">No one flagged right now — nice work!</p>';
  const well = d.doingWell.length ? d.doingWell.map(encourageCard).join("") : '<p class="muted">No one in this group yet.</p>';
  const all = d.students.map(s => '<div class="t-student-row" onclick="openStudent(\'' + esc(s.id) + '\')"><span class="nm">' + esc(s.name) + '</span>' + statusChips(s) + '<span class="mt" style="flex-basis:100%">' + esc(studentMeta(s)) + '</span></div>').join("");
  const lessonRows = d.lessons.length ? d.lessons.map(l => '<div class="t-misc-row t-clickable" onclick="openLesson(\'' + esc(l.key) + '\')"><span class="t-misc-title">' + esc(l.title) + '<br><span class="muted">' + esc(l.subject) + '</span></span><span class="t-misc-meta">' +
      l.students + ' student' + (l.students === 1 ? '' : 's') + (l.avgPct != null ? ' · avg ' + l.avgPct + '%' : '') + (l.struggling ? ' · ' + l.struggling + ' struggling' : '') + ' →</span></div>').join("")
    : '<p class="muted">No lessons practised yet.</p>';
  const qRows = d.questionInsights.length ? d.questionInsights.map(q => '<div class="t-misc-row"><span class="t-misc-title">' + esc(q.prompt || ("Question " + (q.qi + 1))) + '<br><span class="muted">' + esc(q.title) + ' · question ' + (q.qi + 1) + '</span></span><span class="t-misc-meta">' +
      q.underHalf + ' of ' + q.students + ' (' + q.pct + '%) under half marks first time</span></div>').join("")
    : '<p class="muted">No question has a first attempt under half marks yet.</p>';
  const erRows = view.tab === "overview" && view.classes.length > 1
    ? d.examReadyByClass.map(r => erRow(className(r.classId), r.full, r.scored)).join("")
    : d.examReady.map(r => erRow(r.label, r.full, r.scored)).join("");
  const assigned = d.assignments.length ? '<h3 class="t-section-title" style="margin-top:0">Assigned Learning</h3><div class="t-areport-wrap">' + d.assignments.map(assignmentReport).join("") + '</div>' : "";
  return '<div class="dash-shell">' +
    '<div class="teacher-hero-card"><div class="teacher-hero-img-wrap"><img class="teacher-hero-img" src="assets/ethixo_teacher_hero.webp" width="1774" height="887" alt=""><div class="teacher-hero-scrim"></div></div>' +
      '<div class="teacher-hero-text">' + teacherAvatar(40) + '<div class="teacher-hero-copy"><h1>' + greeting() + ', ' + esc(view.profile.display_name) + '!</h1><p>' + esc(heroSub) + '</p></div></div></div>' +
    '<div class="t-workspace-context"><span class="t-workspace-chip">' + dicon("globe", 15) + ' Primary 6 · English, Science &amp; Social Science</span> <button class="t-workspace-chip" style="border:none;cursor:pointer;color:var(--brand-deep);background:var(--brand-light);" onclick="nav(\'assign\', { assignDone: false })">📋 Assign Learning</button></div>' +
    tabs +
    '<div class="card" style="margin-top:0"><div class="row" style="justify-content:space-between"><div><b>' + esc(label) + '</b></div><div>' + (cls ? 'Class code for students: <span class="code">' + esc(cls.join_code) + '</span>' : view.classes.map(c => esc(c.name) + ': <span class="code">' + esc(c.join_code) + '</span>').join(' · ')) + '</div></div></div>' +
    (view.msg ? '<p class="muted">' + esc(view.msg) + ' <button class="link" onclick="loadAll()">Retry</button></p>' : '') +
    assigned +
    '<h3 class="t-section-title">This Term\'s Class Progress — ' + esc(label) + '</h3><div class="t-progress-grid">' + cards + '</div>' +
    '<div class="noticed-card-refined"><div class="noticed-head"><span class="nh-badge">' + dicon("eye", 24) + '</span><h3>Ethixo Noticed</h3></div><div class="noticed-list">' + noticed + '</div></div>' +
    '<div class="t-encourage-wrap"><h3 class="t-section-title">Students to Encourage</h3><p class="t-encourage-hint">Who may benefit from a little more encouragement right now? Under 40% on best attempts, or relying on Thinking Help for at least half of their questions.</p><div class="t-encourage-grid">' + attn + '</div></div>' +
    '<div class="t-encourage-wrap"><h3 class="t-section-title">Doing well</h3><p class="t-encourage-hint">Students scoring 70% or more on their best attempts (after at least ' + R.minQuestions + ' questions).</p><div class="t-encourage-grid">' + well + '</div></div>' +
    '<h3 class="t-section-title">All students</h3>' + (all || '<p class="muted">No students have joined yet. Share the class code.</p>') +
    '<div class="t-insights-card"><div class="t-head"><span class="t-badge">' + dicon("bulb", 24) + '</span><h3>Teaching Insights</h3></div>' +
      '<p class="hint">Questions where students most often scored under half marks on their first attempt (curriculum question shown; never a student\'s answer).</p>' + qRows +
      '<p class="hint" style="margin-top:22px">Lessons students are practising. Lessons with a student struggling are listed first. Tap a lesson for details.</p>' + lessonRows + '</div>' +
    '<div class="examready-card-refined"><div class="er-head"><span class="er-badge">' + dicon("star", 24) + '</span><h3>Exam Ready Answers</h3></div><p class="hint">Of the answers scored so far, how many reached full marks on the best attempt.</p>' + (erRows || '<p class="muted">No scored answers yet.</p>') + '</div>' +
    '<details class="t-rules"><summary>How these signals work</summary><ul>' +
      '<li>Score = a student\'s best attempt on each question ÷ the marks available. Averages use best attempts only.</li>' +
      '<li>Doing well ≥ ' + Math.round(R.doingWell * 100) + '% · Making progress ' + Math.round(R.makingProgress * 100) + '–' + (Math.round(R.doingWell * 100) - 1) + '% · May need attention &lt; ' + Math.round(R.makingProgress * 100) + '%. Fewer than ' + R.minQuestions + ' questions = Just getting started.</li>' +
      '<li>Relies on Thinking Help: used on at least ' + Math.round(R.thinkingShare * 100) + '% of ≥ ' + R.minQuestions + ' attempted questions.</li>' +
      '<li>New ideas understood: lessons in which a student reached full marks on at least one question. Exam-ready answers: best attempt at full marks.</li>' +
      '<li>Misconceptions corrected: first attempt under half marks and a later attempt at full marks (the same rule students\' own dashboards use).</li>' +
      '<li>Full marks without Thinking Help: full marks on a question where Thinking Help was never used. This is a proxy signal, not proof that a student explained their reasoning independently.</li>' +
      '<li>Ethixo Noticed behaviours (keeps trying, first-try full marks, works through thinking) need evidence from at least ' + R.behaviourMin + ' different questions.</li>' +
      '<li>Struggling in a lesson: ≥ ' + R.lessonMinQuestions + ' questions attempted there, average under ' + Math.round(R.lessonStruggle * 100) + '%. Assignment status: Not Started (nothing attempted) · Completed (every question at full marks) · Needs Practice (≥ ' + R.assignNeedsPracticeMin + ' attempted, average under ' + Math.round(R.assignNeedsPractice * 100) + '%) · otherwise In Progress.</li>' +
      '<li>Not available: concept-level misconception names, Thinking Cycle quality and anything written by students. Ethixo does not see or keep students\' written answers, feedback or Thinking Help conversations. These are simple counts of scores and activity, not a judgement of ability.</li></ul></details>' +
    '<p class="muted" style="margin-top:14px">Read-only except for assignments. <button class="link" onclick="loadAll()">Refresh</button></p>' +
    '</div>';
}
function erRow(label, full, scored){ return '<div class="er-row"><span class="er-name">' + esc(label) + '</span><span class="t-er-counts"><span class="t-er-frac"><b>' + full + '</b> / ' + scored + '</span><span class="t-er-caption">exam-ready answers</span></span></div>'; }
function assignmentReport(a){
  const rows = a.rows.length ? a.rows.map(r => '<div class="t-areport-row"><span class="t-areport-name">' + esc(r.name) + '</span><span class="t-areport-status-frac"><span class="t-astatus2 ' + ASTATUS[r.status] + '">' + r.status + '</span>' +
    (r.status !== "Not Started" ? '<span class="t-areport-frac">' + r.done + '/' + r.total + '</span>' : '') + '</span></div>').join("") : '<p class="muted">No students in this class yet.</p>';
  return '<div class="t-areport"><div class="t-areport-class">' + esc(className(a.classId)) + '</div><div class="t-areport-lesson">' + esc(a.subject) + ' · ' + esc(a.lessonTitle) + '</div>' +
    '<div class="t-areport-due">Due date: ' + esc(fmtDue(a.dueDate)) + '</div><div class="t-areport-rows">' + rows + '</div></div>';
}

function metricDetail(m, d){
  const info = d.metrics[m];
  const items = info.items.length ? info.items.map(it => '<div class="detail-item"><b>' + esc(it.title) + '</b><span>' + esc(it.note) + '</span></div>').join("") : '<p class="muted">Nothing to show yet.</p>';
  return '<div class="dash-shell"><div class="card"><h1>' + esc(info.label) + ' — ' + esc(view.tab === "overview" ? "All classes" : className(view.tab)) + '</h1><div class="t-insight-banner">' + esc(info.insight) + '</div>' + items + backBtn() + '</div></div>';
}
function lessonDetail(l, d){
  const studs = d.students.map(s => ({ s: s, l: s.lessons.find(x => x.key === l.key) })).filter(x => x.l).sort((a, b) => (a.l.avgRatio == null) - (b.l.avgRatio == null) || (a.l.avgRatio || 0) - (b.l.avgRatio || 0));
  const rows = studs.map(x => '<div class="t-student-row" onclick="openStudent(\'' + esc(x.s.id) + '\')"><span class="nm">' + esc(x.s.name) + '</span>' + (x.l.struggling ? '<span class="t-chip warn">Struggling</span>' : x.l.hasFull ? '<span class="t-chip">Full marks reached</span>' : '<span class="t-chip blue">Practising</span>') +
    '<span class="mt" style="flex-basis:100%">' + x.l.questions + ' question' + (x.l.questions === 1 ? '' : 's') + (x.l.avgRatio != null ? ' · avg ' + Math.round(x.l.avgRatio * 100) + '%' : '') + ' · Thinking Help ' + x.l.thinkingQs + '/' + x.l.questions + '</span></div>').join("");
  const meta = META && META[l.level] && META[l.level][l.subjectKey] && META[l.level][l.subjectKey].lessons[l.lessonId];
  const qs = meta ? meta.marks.map((m, i) => {
    let n = 0, full = 0, under = 0; d.students.forEach(s => s.qs.forEach(q => { if (q.level === l.level && q.sk === l.subjectKey && q.lesson === l.lessonId && q.qi === i) { n++; if (q.full) full++; if (q.underHalfFirst) under++; } }));
    return '<div class="t-misc-row"><span class="t-misc-title">' + esc(meta.prompts[i]) + '<br><span class="muted">Question ' + (i + 1) + ' · ' + m + ' mark' + (m === 1 ? '' : 's') + '</span></span><span class="t-misc-meta">' + (n ? n + ' tried · ' + full + ' full marks · ' + under + ' under half first time' : 'not tried yet') + '</span></div>';
  }).join("") : "";
  return '<div class="dash-shell"><div class="card"><h1>' + esc(l.title) + '</h1><p class="muted">' + esc(l.subject) + ' · ' + l.students + ' student' + (l.students === 1 ? '' : 's') + (l.avgPct != null ? ' · average ' + l.avgPct + '%' : '') + '</p>' +
    '<h3 class="t-section-title" style="margin-top:20px">Students</h3>' + rows +
    '<div class="t-insights-card" style="margin-top:22px"><div class="t-head"><span class="t-badge">' + dicon("bulb", 24) + '</span><h3>Questions in this lesson</h3></div><p class="hint">Curriculum questions only. Scores and counts, never student answers.</p>' + qs + '</div>' + backBtn() + '</div></div>';
}
function studentDetail(s){
  const f = s.focusLesson;
  const rows = [
    ["Current focus", esc(f ? f.title : (s.lessons[0] ? s.lessons[0].title : "–"))], ["Recent progress", esc(s.progress)], ["Status", statusChips(s)],
    ["Questions attempted", esc(s.questions)], ["Attempts in total", esc(s.attempts)], ["Lessons practised", esc(s.lessonsPractised)], ["New ideas understood (lessons)", esc(s.newIdeas)],
    ["Average score (best attempts)", esc(s.avgPct == null ? "–" : s.avgPct + "%")], ["Exam-ready answers (full marks)", esc(s.scored ? s.fullMarks + " of " + s.scored : "–")],
    ["Misconceptions corrected", esc(s.corrected)], ["Full marks without Thinking Help", esc(s.fullNoThinking)],
    ["Thinking Help used on", esc(s.questions ? s.thinkingQs + " of " + s.questions + " questions" : "–")],
    ["Retried questions", esc(s.retried + (s.retriedFull ? " (" + s.retriedFull + " reached full marks)" : ""))], ["Last active", esc(fmtDate(s.lastAt))],
  ].map(r => '<div class="t-detail-row"><span class="t-detail-label">' + r[0] + '</span><span class="t-detail-val">' + r[1] + '</span></div>').join("");
  const notes = []; const R = view.ins.rules;
  if (!s.questions) notes.push("Joined the class but has not practised yet.");
  else {
    if (s.doingWell) notes.push("Scoring well: " + s.avgPct + "% of the marks on best attempts.");
    if (s.needsAttention) notes.push("Scoring " + s.avgPct + "% of the marks on best attempts, which may need attention.");
    if (s.performance === "Just getting started") notes.push("Only " + s.questions + " question" + (s.questions === 1 ? "" : "s") + " attempted so far; not enough to read a pattern yet.");
    if (s.improved >= R.behaviourMin) notes.push("Keeps trying after a tricky first attempt: improved after retrying on " + s.improved + " questions.");
    else if (s.progress === "Improving") notes.push("Improving: scored higher after retrying on " + s.improved + " questions.");
    if (s.firstTry >= R.behaviourMin) notes.push("Reaching full marks on the first try on " + s.firstTry + " questions.");
    if (s.thinkingHeavy) notes.push("Used Thinking Help on " + s.thinkingQs + " of " + s.questions + " questions.");
    if (s.corrected) notes.push(s.corrected + " answer" + (s.corrected === 1 ? "" : "s") + " went from under half marks to full marks.");
    if (f && f.struggling) notes.push("Struggling in: " + f.title + ".");
  }
  const noticed = (notes.length ? notes : ["Nothing to show yet."]).map(n => '<div class="noticed-item-refined"><span class="ni-mark">✓</span><span>' + esc(n) + '</span></div>').join("");
  const lessons = s.lessons.length ? s.lessons.map(l => '<div class="t-misc-row"><span class="t-misc-title">' + esc(l.title) + '<br><span class="muted">' + esc(l.subject) + '</span></span><span class="t-misc-meta">' +
      l.questions + ' q' + (l.avgRatio != null ? ' · ' + Math.round(l.avgRatio * 100) + '%' : '') + (l.thinkingQs ? ' · Thinking Help ' + l.thinkingQs : '') + (l.struggling ? ' · struggling' : '') + '</span></div>').join("") : '<p class="muted">No lessons practised yet.</p>';
  return '<div class="dash-shell"><div class="card"><h1>' + esc(s.name) + '</h1>' + rows +
    '<div class="noticed-card-refined" style="margin-top:22px"><div class="noticed-head"><span class="nh-badge">' + dicon("eye", 24) + '</span><h3>Ethixo Noticed</h3></div><div class="noticed-list">' + noticed + '</div></div>' +
    '<div class="t-insights-card" style="margin-top:22px"><div class="t-head"><span class="t-badge">' + dicon("bulb", 24) + '</span><h3>Lessons practised</h3></div><p class="hint">Scores and activity only. No answers, feedback or Thinking Help conversations are shown.</p>' + lessons + '</div>' + backBtn() + '</div></div>';
}

/* ---- Assign Learning (same form and confirmation as the Sharon demo). Writes ONE row to public.assignments (RLS: approved teacher, own class). ---- */
function assignScreen(){
  if (view.assignDone) return '<div class="dash-shell"><div class="card center"><h1 class="title">✅ Assignment assigned successfully.</h1><p class="muted">' + esc(className(view.assignClass)) + ' will see this in their Assigned Learning.</p>' +
    '<div class="row" style="justify-content:center;margin-top:20px"><button class="btn btn-ghost" onclick="nav(\'assign\', { assignDone: false })">Assign Another</button><button class="btn btn-primary" onclick="backToDash()">Go to Teacher Dashboard</button></div></div></div>';
  const subj = view.assignSubject || "EN"; const lvl = META && META[WS_LEVEL] || {};
  const lessons = lvl[subj] ? Object.keys(lvl[subj].lessons).filter(id => !lvl[subj].lessons[id].locked).map(id => ({ id: id, title: lvl[subj].lessons[id].title })) : [];
  const cls = view.classes.map(c => '<option value="' + esc(c.id) + '"' + (c.id === (view.assignClass || (view.tab !== "overview" ? view.tab : view.classes[0].id)) ? " selected" : "") + '>' + esc(c.name) + '</option>').join("");
  const subs = Object.keys(lvl).map(k => '<option value="' + esc(k) + '"' + (k === subj ? " selected" : "") + '>' + esc(lvl[k].name) + '</option>').join("");
  return '<div class="dash-shell"><div class="card"><h1 class="title">📋 Assign Learning</h1><p class="muted">Give your class a specific lesson to practise, with a due date.</p>' +
    '<label class="field">Class</label><select class="assign-input" id="assignClass">' + cls + '</select>' +
    '<label class="field">Subject</label><select class="assign-input" id="assignSubject" onchange="view.assignSubject=this.value;view.assignClass=document.getElementById(\'assignClass\').value;renderDashboard()">' + subs + '</select>' +
    '<label class="field">Lesson</label><select class="assign-input" id="assignLesson">' + lessons.map(l => '<option value="' + esc(l.id) + '">' + esc(l.title) + '</option>').join("") + '</select>' +
    '<label class="field">Due date</label><input class="assign-input" type="date" id="assignDueDate">' +
    (view.assignMsg ? '<p class="muted" style="margin-top:10px">' + esc(view.assignMsg) + '</p>' : '') +
    '<button class="btn btn-primary" style="margin-top:16px" onclick="assignLearning()">Assign Learning</button>' +
    '<button class="btn btn-ghost" style="margin-top:12px" onclick="backToDash()">Back to Dashboard</button></div></div>';
}
async function assignLearning(){
  const classId = document.getElementById("assignClass").value, subject = document.getElementById("assignSubject").value, lesson = document.getElementById("assignLesson").value, due = document.getElementById("assignDueDate").value;
  view.assignClass = classId; view.assignSubject = subject;
  if (!lesson) { view.assignMsg = "Choose a lesson first"; return renderDashboard(); }
  if (!due) { view.assignMsg = "Choose a due date first"; return renderDashboard(); }
  const r = await client.from("assignments").insert({ class_id: classId, level: WS_LEVEL, subject_key: subject, lesson_id: lesson, due_date: due });
  if (r.error) { view.assignMsg = "Could not assign right now. Please try again."; return renderDashboard(); }
  view.assignMsg = ""; view.assignDone = true; await loadAll(); view.page = "assign"; renderDashboard();
}

boot();
</script>
