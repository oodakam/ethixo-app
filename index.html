

















<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethixo — Learn to answer with Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --brand:#00A86B; --brand-dark:#00875A; --brand-deep:#046B4A;
    --brand-light:#E3F5EC; --brand-light-b:#BFE9D4;
    --ink:#182420; --muted:#5E6D66;
    --amber:#C9821F; --amber-bg:#FBF0DE;
    --bg:#EAEAEA; --card:#FFFFFF; --border:#DBDFDC; --panel:#E2E4E2;
    --radius:18px; --shadow:0 4px 18px rgba(24,36,32,.07);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  h1,h2,h3,.logo{font-family:'Montserrat',sans-serif;}
  #app{max-width:920px;margin:0 auto;padding:30px 20px 24px;width:100%;flex:1 0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .logo{font-weight:800;font-size:27px;color:var(--brand);letter-spacing:-.5px;cursor:pointer;}
  .badge{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:3px 11px;background:var(--card);font-weight:600;}
  .topbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vault-link{border:none;color:var(--muted);background:transparent;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;}
  .vault-link:hover{background:var(--panel);color:var(--ink);}
  .vault-link.active{background:var(--brand-light);color:var(--brand-deep);}
  .crumb{color:var(--muted);font-size:13.5px;margin-bottom:18px;font-weight:500;}
  .crumb b{color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;}
  .center{text-align:center;}
  h1.title{font-size:27px;color:var(--ink);margin:0 0 6px;font-weight:700;}
  p.sub{color:var(--muted);margin:0 0 26px;font-size:15px;}
  .grid{display:grid;gap:16px;}
  .grid.cols2{grid-template-columns:1fr 1fr;}
  .grid.cols3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:640px){.grid.cols3{grid-template-columns:1fr;}}
  @media(max-width:480px){.grid.cols2{grid-template-columns:1fr;}}
  .choice{border:2px solid var(--border);border-radius:16px;padding:22px;text-align:center;cursor:pointer;background:#fff;transition:.15s;position:relative;}
  .choice:hover{border-color:var(--brand-light-b);}
  .choice.selected{border-color:var(--brand);background:var(--brand-light);}
  .choice .tag{position:absolute;top:10px;right:10px;font-size:10px;background:var(--amber-bg);color:var(--amber);padding:3px 8px;border-radius:10px;font-weight:700;}
  .choice .emoji{font-size:34px;display:block;margin-bottom:10px;}
  .choice h3{margin:4px 0 2px;font-size:17px;color:var(--ink);}
  .choice p{margin:0;color:var(--muted);font-size:12.5px;}
  .btn{border:none;border-radius:12px;padding:13px 22px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Montserrat',sans-serif;transition:.15s;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06);}
  .btn-outline{background:#fff;border:1.5px solid var(--brand);color:var(--brand-deep);}
  .btn-outline:hover:not(:disabled){background:var(--brand-light);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row.between{justify-content:space-between;align-items:center;}
  .row.end{justify-content:flex-end;}
  @media(max-width:480px){.row.between{flex-direction:column-reverse;align-items:stretch;}.row.between .btn, .row.end .btn{width:100%;}.row .btn{flex:1;}}
  .chapter{border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .chapter-head{background:var(--panel);padding:14px 18px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14.5px;}
  .chapter-head.locked{cursor:not-allowed;opacity:.6;}
  .lesson-row{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;}
  .lesson-row:hover{background:var(--brand-light);}
  .lesson-row .lt{font-weight:600;color:var(--ink);font-size:14.5px;}
  .lesson-row .lc{color:var(--muted);font-size:12px;}
  .qrow{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--border);cursor:pointer;flex-wrap:wrap;}
  .qrow:hover{background:var(--brand-light);border-radius:10px;}
  .qnum{width:26px;height:26px;border-radius:50%;background:var(--brand-deep);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .qtext{flex:1;font-size:14.5px;min-width:180px;}
  .qmeta{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .privacy-note{color:var(--muted);font-size:13.5px;line-height:1.5;margin:14px 0 10px;font-weight:400;}
  .privacy-note b{font-weight:600;color:var(--muted);}
  .status{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .status.done{background:var(--brand-light);color:var(--brand-deep);}
  .status.almost{background:#E3EEFB;color:#1D5A9E;}
  .status.review{background:var(--amber-bg);color:var(--amber);}
  .status.none{background:#eee;color:#888;}
  textarea{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:14px;font-family:'Montserrat',sans-serif;font-size:14.5px;resize:vertical;min-height:130px;}
  textarea:focus,input:focus,.choice:focus-visible,.btn:focus-visible{outline:3px solid var(--brand-light-b);outline-offset:1px;}
  input[type=range]{width:100%;accent-color:var(--brand);}
  label.field{font-weight:700;color:var(--ink);font-size:13.5px;display:block;margin:16px 0 6px;}
  .qpanel{background:var(--brand-light);border:1px solid var(--brand-light-b);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .qpanel b{color:var(--brand-deep);}
  .loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:20px 0;}
  .spinner{width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Student Dashboard (premium visual pass v3 — final polish) ---- */
  #app.app-wide{max-width:1160px;}
  .dash-shell{--ds-xs:10px; --ds-sm:20px; --ds-md:30px; --ds-lg:44px; --card-shadow:0 1px 2px rgba(24,36,32,.04),0 10px 28px -10px rgba(24,36,32,.12); --card-radius:22px;}
  .dash-welcome-refined{display:flex;align-items:center;gap:20px;margin-bottom:var(--ds-lg);}
  .dash-welcome-refined .dw-avatar{flex:none;}
  .dash-welcome-refined h1{margin:0 0 5px;font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.4px;}
  .dash-welcome-refined p{margin:0;color:var(--muted);font-size:16px;}

  .journey-card-refined{position:relative;border-radius:var(--card-radius);overflow:hidden;margin-bottom:var(--ds-lg);box-shadow:0 2px 8px rgba(24,36,32,.06),0 24px 48px -16px rgba(14,58,38,.32);background:#EAF3EC;}
  .journey-hero-img{display:block;width:100%;height:auto;max-width:1400px;aspect-ratio:2/1;object-fit:cover;margin:0 auto;}
  .journey-content-card{position:absolute;right:5%;bottom:7%;max-width:400px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:24px 26px;box-shadow:0 16px 36px rgba(14,58,38,.22),0 2px 10px rgba(14,58,38,.1);}
  .journey-content-card .jt-title{font-size:21px;font-weight:800;color:var(--ink);line-height:1.22;margin:0 0 8px;letter-spacing:-.2px;}
  .journey-content-card .jt-sub{font-size:14.5px;font-weight:500;color:var(--muted);line-height:1.42;margin:0 0 16px;}
  .journey-cta-row{display:flex;gap:10px;}
  .journey-cta-primary{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;border:none;border-radius:11px;padding:11px 18px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 6px 14px rgba(0,168,107,.3);transition:transform .12s;white-space:nowrap;}
  .journey-cta-primary:hover{transform:translateY(-1px);}
  .journey-cta-secondary{background:#fff;color:var(--ink);border:1.5px solid var(--border);border-radius:11px;padding:11px 16px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 2px 6px rgba(24,36,32,.08);transition:transform .12s,border-color .12s;}
  .journey-cta-secondary:hover{border-color:var(--brand);transform:translateY(-1px);}
  @media(max-width:560px){
    .journey-card-refined{height:230px;}
    .journey-hero-img{height:100%;aspect-ratio:auto;object-position:center;}
    .journey-content-card{right:4%;left:auto;bottom:5%;max-width:62%;padding:14px 15px;background:rgba(255,255,255,.88);}
    .journey-content-card .jt-title{font-size:15px;margin-bottom:5px;}
    .journey-content-card .jt-sub{font-size:11.5px;margin-bottom:9px;line-height:1.35;}
    .journey-cta-row{flex-direction:column;gap:7px;}
    .journey-cta-primary,.journey-cta-secondary{width:100%;text-align:center;padding:9px 12px;font-size:12px;}
  }

  .noticed-card-refined{background:linear-gradient(155deg,var(--brand-light),#fff 78%);border:1px solid var(--brand-light-b);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:30px 32px;margin-bottom:var(--ds-md);}
  .noticed-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .noticed-head .nh-badge{width:48px;height:48px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(0,168,107,.3);}
  .noticed-head h3{margin:0;font-size:19px;font-weight:800;color:var(--brand-deep);}
  .noticed-list{display:flex;flex-direction:column;gap:2px;}
  .noticed-item-refined{display:flex;align-items:flex-start;gap:13px;padding:12px 0;font-size:16px;color:var(--muted);line-height:1.5;border-top:1px solid rgba(4,107,74,.09);}
  .noticed-item-refined:first-child{border-top:none;}
  .noticed-item-refined .ni-mark{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-light-b);color:var(--brand-deep);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .noticed-item-refined.new{color:var(--brand-deep);font-weight:700;}
  .noticed-item-refined.new .ni-mark{background:var(--brand);color:#fff;}
  .noticed-item-refined .ni-badge{flex:none;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:20px;margin-left:auto;text-transform:uppercase;}

  .growth-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--ds-sm);margin-bottom:var(--ds-md);}
  @media(max-width:720px){.growth-row{grid-template-columns:1fr;}}
  .growth-card{border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:26px 24px 24px;border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;}
  .growth-card.tint-green{background:var(--brand-light);border-color:var(--brand-light-b);}
  .growth-card.tint-blue{background:#E3EEFB;border-color:#c7ddf5;}
  .growth-card.tint-amber{background:var(--amber-bg);border-color:#efd6a4;}
  .growth-card .gc-icon{width:56px;height:56px;border-radius:15px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .growth-card.tint-green .gc-icon{color:var(--brand-deep);}
  .growth-card.tint-blue .gc-icon{color:#1D5A9E;}
  .growth-card.tint-amber .gc-icon{color:#8a5c14;}
  .growth-card .gc-number{font-size:40px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.5px;}
  .growth-card .gc-label{font-size:17px;color:var(--ink);font-weight:600;margin:8px 0 18px;line-height:1.35;}
  .growth-card a.gc-view{font-size:14px;font-weight:700;color:var(--brand-deep);text-decoration:none;margin-top:auto;}
  .growth-card a.gc-view:hover{text-decoration:underline;}

  .examready-card-refined{background:linear-gradient(155deg,#FFF9EC,#fff 70%);border:1px solid #f3e3bd;border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:30px 32px;margin-bottom:var(--ds-md);}
  .examready-card-refined .er-head{display:flex;align-items:center;gap:14px;margin-bottom:5px;}
  .examready-card-refined .er-head .er-badge{width:48px;height:48px;border-radius:14px;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(201,130,31,.3);}
  .examready-card-refined h3{margin:0;font-size:19px;font-weight:800;color:#8a5c14;}
  .examready-card-refined p.hint{margin:5px 0 20px;color:var(--ink);opacity:.65;font-size:14.5px;}
  .er-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.65);margin-bottom:9px;}
  .er-row .er-icon{flex:none;width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;}
  .er-row .er-icon.icon-EN{color:var(--brand-deep);}
  .er-row .er-icon.icon-SCI{color:#1D5A9E;}
  .er-row .er-icon.icon-SS{color:#8a5c14;}
  .er-row .er-name{flex:1;font-size:15.5px;font-weight:700;color:var(--ink);}
  .er-row .er-count{font-size:20px;font-weight:800;color:#8a5c14;}
  .examready-card-refined a.er-viewall{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px 20px;border-radius:13px;font-size:15px;font-weight:700;color:#8a5c14;background:#fff;border:1.5px solid #f0dbae;text-decoration:none;transition:background .12s,border-color .12s;}
  .examready-card-refined a.er-viewall:hover{background:var(--amber-bg);border-color:var(--amber);}

  .nextstep-card-refined{background:linear-gradient(135deg,var(--brand-deep),var(--brand));border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:34px 34px 32px;margin-bottom:var(--ds-xs);color:#fff;position:relative;overflow:hidden;}
  .nextstep-card-refined::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07);}
  .nextstep-card-refined .ns-eyebrow{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:18px;}
  .nextstep-card-refined .ns-icon{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;}
  .nextstep-card-refined .ns-text{font-size:25px;font-weight:800;line-height:1.32;margin-bottom:24px;max-width:92%;position:relative;}
  .nextstep-card-refined .btn-nextstep{background:#fff;color:var(--brand-deep);border:none;border-radius:13px;padding:14px 26px;font-weight:800;font-size:15px;cursor:pointer;position:relative;transition:transform .12s;}
  .nextstep-card-refined .btn-nextstep:hover{transform:translateY(-1px);}

  .dash-empty-refined{background:linear-gradient(155deg,var(--brand-light),#fff 75%);border:1px solid var(--brand-light-b);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:40px 30px;text-align:center;}
  .dash-empty-refined h3{margin:0 0 8px;color:var(--brand-deep);font-size:20px;font-weight:800;}
  .dash-empty-refined p{margin:0 0 22px;color:var(--ink);font-size:15px;}

  /* ---- Teacher Dashboard (confidence dashboard — reuses the Student Dashboard's
     component language: dash-shell tokens, growth-card, noticed-card-refined,
     examready-card-refined. New pieces below are specific to teacher content. ---- */
  .t-section-title{margin:var(--ds-lg) 0 14px;font-size:17px;font-weight:800;color:var(--ink);}
  .class-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--ds-lg);}
  .class-tab{border:1.5px solid var(--border);background:#fff;color:var(--muted);border-radius:11px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
  .class-tab:hover{border-color:var(--brand);color:var(--ink);}
  .class-tab.active{background:var(--brand);color:#fff;border-color:var(--brand-dark);}
  .growth-card.tint-purple{background:#EFE9FA;border-color:#D9CBF2;}
  .growth-card.tint-purple .gc-icon{color:#6B4FA0;}
  .t-progress-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--ds-sm);margin-bottom:var(--ds-md);}
  @media(max-width:900px){.t-progress-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.t-progress-grid{grid-template-columns:1fr;}}
  .t-encourage-wrap{margin-bottom:var(--ds-md);}
  .t-encourage-hint{margin:0 0 14px;color:var(--muted);font-size:14px;}
  .t-encourage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--ds-sm);}
  @media(max-width:760px){.t-encourage-grid{grid-template-columns:1fr;}}
  .t-encourage-card{border-radius:var(--card-radius);box-shadow:var(--card-shadow);border:1px solid var(--border);padding:20px 20px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s;background:#fff;}
  .t-encourage-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,36,32,.12);}
  .t-encourage-name{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:6px;}
  .t-encourage-status{font-size:12px;font-weight:700;color:var(--brand-deep);background:var(--brand-light);display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
  .t-encourage-focus{font-size:14px;color:var(--muted);}
  .t-insights-card{background:linear-gradient(155deg,#E3EEFB,#fff 70%);border:1px solid #c7ddf5;border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:30px 32px;margin-bottom:var(--ds-md);}
  .t-insights-card .t-head{display:flex;align-items:center;gap:14px;margin-bottom:5px;}
  .t-insights-card .t-badge{width:48px;height:48px;border-radius:14px;background:#1D5A9E;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(29,90,158,.3);}
  .t-insights-card h3{margin:0;font-size:19px;font-weight:800;color:#1D5A9E;}
  .t-insights-card p.hint{margin:5px 0 20px;color:var(--ink);opacity:.65;font-size:14.5px;}
  .t-misc-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:13px;background:rgba(255,255,255,.65);margin-bottom:9px;}
  .t-misc-title{font-size:14.5px;font-weight:700;color:var(--ink);}
  .t-misc-meta{font-size:13px;font-weight:700;color:#1D5A9E;white-space:nowrap;margin-left:14px;}
  .t-er-counts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .t-er-counts .t-er-frac{font-size:16px;font-weight:800;color:#8a5c14;white-space:nowrap;}
  .t-er-counts .t-er-frac b{font-size:20px;font-weight:800;}
  .t-er-counts .t-er-caption{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .t-detail-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);font-size:15px;}
  .t-detail-row .t-detail-label{color:var(--muted);font-weight:600;}
  .t-detail-row .t-detail-val{color:var(--ink);font-weight:700;text-align:right;}
  .t-workspace-context{margin-bottom:16px;}
  .t-workspace-chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;padding:7px 14px;border-radius:20px;}
  .teacher-hero-card{position:relative;border-radius:22px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px rgba(24,36,32,.06),0 20px 40px -16px rgba(14,58,38,.22);background:#EAF3EC;height:400px;}
  .teacher-hero-img-wrap{position:absolute;inset:0;}
  .teacher-hero-img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 50%;}

          {t:"Name one major religion practised in Southeast Asia.", m:1, a:"Accept any one: Islam, Buddhism, Christianity, Hinduism."},
          {t:"Explain why Southeast Asia is often described as a culturally diverse region.", m:5, a:"Southeast Asia has been shaped by centuries of trade, migration and colonisation, which brought different groups of people, languages, religions and customs into the region. Traders and settlers from India, China and the Middle East introduced Hinduism, Buddhism and Islam, while European colonisation later brought Christianity and Western influences. As a result, the region is home to many ethnic groups, such as Malay, Chinese, Indian and various indigenous communities, who each practise their own religions, languages, food and traditions. This long history of interaction and exchange, rather than one single dominant culture, is why Southeast Asia is considered a highly culturally diverse region."},

          {t:"Name one regional organisation that connects Singapore with its Southeast Asian neighbours.", m:1, a:"ASEAN (the Association of Southeast Asian Nations)."},

          {t:"Explain how transport links have strengthened ties between Singapore and the rest of Southeast Asia.", m:10, a:"Singapore is connected to the rest of Southeast Asia through several transport links. Land links, such as the Causeway and Second Link bridges to Malaysia, let people, vehicles and goods travel easily between the two countries every day for work, school, trade and family visits. Sea links, through the Port of Singapore, one of the busiest container ports in the world, connect Singapore to ports throughout the region, supporting trade with countries such as Indonesia, Vietnam and Thailand. Air links through Changi Airport connect Singapore to major Southeast Asian cities with frequent, affordable flights, making it easy for tourists, students and businesspeople to travel between countries. Together, these transport links have made it faster, cheaper and easier for people, goods and ideas to move between Singapore and its neighbours, strengthening economic ties through trade and investment, social ties through family connections and labour movement, and cultural ties through tourism and shared experiences, helping the region grow more closely interconnected over time."},

// Deterministic — real application logic, not AI, per the brief (section 14).
function getTeacherDashboardData(classId){
  const isOverview = !classId || classId === "overview";
  const classIds = isOverview ? TEACHER_CLASSES.map(c=>c.id) : [classId];

  // Real Wenbo Lee data blended into P6-A only (he's the one real, live student on
  // this device) — same blending pattern the dashboard already used before this rework.
  // Only his SOCIAL STUDIES exam-ready answers count here, matching the subject lock.
  const wenboSSExamReady = (state.vault||[]).filter(v=>v.subjectKey==="SS").length;

  function classExamReady(id){
    const r = TEACHER_CLASS_DATA[id].examReady;
    const bonus = id==="p6a" ? wenboSSExamReady : 0;
    return { answerCount: r.answerCount + bonus, examReadyCount: r.examReadyCount + bonus };
  }

  const progress = classIds.reduce(function(acc,id){
    const d = TEACHER_CLASS_DATA[id];
    const er = classExamReady(id);
    acc.newIdeas += d.progress.newIdeas; acc.misconceptionsCorrected += d.progress.misconceptionsCorrected;
    acc.examReadyWritten += er.examReadyCount; acc.explainedIndependently += d.progress.explainedIndependently;
    return acc;
  }, {newIdeas:0, misconceptionsCorrected:0, examReadyWritten:0, explainedIndependently:0});

  const noticed = [].concat.apply([], classIds.map(function(id){ return TEACHER_CLASS_DATA[id].noticed; })).slice(0,4);

  const encourage = [].concat.apply([], classIds.map(function(id){
    return TEACHER_CLASS_DATA[id].encourage.map(function(e){ return Object.assign({classId:id, classLabel:TEACHER_CLASSES.find(c=>c.id===id).label}, e); });
  })).slice(0,3);

  // "Seen in N classes" — a genuine deterministic aggregation across each class's
  // own misconception list, sorted by how widespread it is (most classes first).
  const misconceptionCounts = {};
  classIds.forEach(function(id){
    TEACHER_CLASS_DATA[id].misconceptions.forEach(function(m){
      misconceptionCounts[m.title] = (misconceptionCounts[m.title]||0) + 1;
    });
  });
  const misconceptions = isOverview
    ? Object.keys(misconceptionCounts).map(function(title){ return {title:title, classCount:misconceptionCounts[title]}; })
        .sort(function(a,b){ return b.classCount - a.classCount; })
    : TEACHER_CLASS_DATA[classId].misconceptions.map(function(m){ return {title:m.title, pct:m.pct}; });

  // Exam Ready Answers — this teacher's ONE subject only. Overview shows a
  // per-CLASS breakdown (subject is fixed, so subject-breakdown no longer applies);
  // a specific class shows a single total for that class.
  const examReadyByClass = classIds.map(function(id){
    const er = classExamReady(id);
    return Object.assign({classId:id, classLabel:TEACHER_CLASSES.find(c=>c.id===id).label}, er);
  });
  const examReadyTotal = examReadyByClass.reduce(function(acc,r){ acc.answerCount+=r.answerCount; acc.examReadyCount+=r.examReadyCount; return acc; }, {answerCount:0, examReadyCount:0});

  return {
    isOverview: isOverview,
    classLabel: isOverview ? "All Classes" : TEACHER_CLASSES.find(c=>c.id===classId).label,
    progress: progress,
    noticed: noticed,
    encourage: encourage,
    misconceptions: misconceptions,
    examReadyTotal: examReadyTotal,
    examReadyByClass: examReadyByClass,
  };
}

/* ---------- Time tracking (this browser/device only) ---------- */
function todayKey(){ return new Date().toISOString().slice(0,10); }
function addTimeSpent(seconds){
  if(seconds<=0) return;
  const log = sGet("timelog") || {};
  const k = todayKey();
  log[k] = (log[k]||0) + seconds;
  sSet("timelog", log);
}
function getTimeSpent(period){
  const log = sGet("timelog") || {};
  const now = new Date();
  let total = 0;
  Object.keys(log).forEach(function(dateStr){
    const secs = log[dateStr];
    const d = new Date(dateStr+"T00:00:00");
    if(period==="today"){ if(dateStr===todayKey()) total+=secs; }
    else if(period==="week"){ const diffDays=Math.floor((now-d)/86400000); if(diffDays>=0 && diffDays<7) total+=secs; }
    else if(period==="month"){ if(d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth()) total+=secs; }
    else if(period==="year"){ if(d.getFullYear()===now.getFullYear()) total+=secs; }
  });
  return total;
}
function formatDuration(seconds){
  seconds = Math.round(seconds||0);
  const h = Math.floor(seconds/3600), m = Math.floor((seconds%3600)/60);
  if(h>0) return h+"h "+m+"m";
  if(m>0) return m+"m";
  return "<1m";
}
let __lastTick = Date.now();
function startHeartbeat(){
  __lastTick = Date.now();
  setInterval(function(){
    if(document.visibilityState === "visible"){
      const now = Date.now();
      addTimeSpent(Math.round((now-__lastTick)/1000));
      __lastTick = now;
    } else { __lastTick = Date.now(); }
  }, 15000);
  document.addEventListener("visibilitychange", function(){ __lastTick = Date.now(); });
  window.addEventListener("beforeunload", function(){ addTimeSpent(Math.round((Date.now()-__lastTick)/1000)); });
}

/* ---------- Mastery computation (best-score based, independent of ScholarVault save status) ---------- */
function computeMastery(level, subjectKey){
  const subj = LEVELS[level][subjectKey];
  let totalMarks=0, earnedMarks=0, attemptedCount=0, totalCount=0;
  subj.chapters.forEach(function(ch){
    if(ch.locked) return;
    ch.lessons.forEach(function(l){
      l.questions.forEach(function(q, idx){
        totalCount++; totalMarks += q.m;
        const key = "attempts:"+level+":"+subjectKey+":"+l.id+":"+idx;
        const attempts = sGet(key) || [];
        if(attempts.length){
          attemptedCount++;
          let best = 0;
          attempts.forEach(function(a){ const s=attemptScore(a); if(s>best) best=s; });
          earnedMarks += Math.min(best, q.m);
        }
      });
    });
  });
  const pct = totalMarks>0 ? Math.round((earnedMarks/totalMarks)*100) : 0;
  return { pct: pct, earnedMarks: earnedMarks, totalMarks: totalMarks, attemptedCount: attemptedCount, totalCount: totalCount };
}
function computeOverallMastery(level){
  let totalMarks=0, earnedMarks=0;
  ["EN","SCI","SS"].forEach(function(k){
    const m = computeMastery(level, k);
    totalMarks += m.totalMarks; earnedMarks += m.earnedMarks;
  });
  return totalMarks>0 ? Math.round((earnedMarks/totalMarks)*100) : 0;
}

/* ---------- AI calls — go through OUR OWN secure backend, not directly to Anthropic ---------- */
async function getAIFeedback(question, marks, answer, modelAnswer, thinkingHistory, priorAttempts){
  const res = await fetch("/api/feedback", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ question, marks, answer, modelAnswer: modelAnswer||null,
      thinkingHistory: (thinkingHistory&&thinkingHistory.length)?thinkingHistory:undefined,
      priorAttempts: (priorAttempts&&priorAttempts.length)?priorAttempts:undefined })
  });
  const data = await res.json();
  if(!res.ok){ throw new Error(data.error || ("Server error "+res.status)); }
  return data;
}
async function validateCustomQuestion(subjectName, lessonTitle, questionText){
  const res = await fetch("/api/validate", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ subjectName, lessonTitle, questionText })
  });
  const data = await res.json();
  if(!res.ok){ throw new Error(data.error || ("Server error "+res.status)); }
  return data;
}

/* ---------- Navigation (with real browser history support) ---------- */
function stateSnapshot(){
  return { view: state.view, level: state.level, subjectKey: state.subjectKey, lessonId: state.lessonId,
    currentQuestion: state.currentQuestion, answerDraft: state.answerDraft, feedback: state.feedback,
    thinkingTurn: state.thinkingTurn, thinkingHistory: state.thinkingHistory, thinkingHistoryQid: state.thinkingHistoryQid, questionDemand: state.questionDemand,
    usedClarification: state.usedClarification, awaitingFinalAnswer: state.awaitingFinalAnswer,
    thinkingDraft: state.thinkingDraft, improveDraft: state.improveDraft,
    teacherClassId: state.teacherClassId, teacherStudentName: state.teacherStudentName, teacherProgressMetric: state.teacherProgressMetric };
}
function goto(view, extra){
  requestSeq++; // invalidate any in-flight request from the screen we're leaving
  state.view = view; Object.assign(state, extra||{}); state.error = null;
  if(view === "qbank" && state.lessonId){ saveLastLesson(state.level, state.subjectKey, state.lessonId); }
  try{ history.pushState(stateSnapshot(), "", "#"+view); }catch(e){ /* history API unavailable in this context (e.g. sandboxed preview) — continue without it */ }
  render();
}
window.addEventListener("popstate", (e)=>{
  if(e.state){
    requestSeq++; // same as goto() — leaving the current screen invalidates any pending request
    Object.assign(state, e.state);
    state.error = null; state.loading = false; state.validating = false;
    render();
  }
});
function toast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2400); }

/* ---- Question bank ---- */
function findLesson(){
  const subj = LEVELS[state.level][state.subjectKey];
  for(const ch of subj.chapters){ for(const l of ch.lessons){ if(l.id===state.lessonId) return l; } }
  return null;

async function viewQBank(){
  const lesson = findLesson();
  const rows = await Promise.all(lesson.questions.map(async (q,idx)=>{
    const qObj = { id:String(idx), level:state.level, subjectKey:state.subjectKey, lessonId:lesson.id, t:q.t, m:q.m };
    const key = qKey(qObj);
    const attempts = (await sGet(key)) || [];
    const savedInVault = state.vault.some(v=>v.qid===key);
    let status = "none", label="Not Attempted";
    if(attempts.length){
      let best = 0;
      attempts.forEach(a=>{ const s=attemptScore(a); if(s>best) best=s; });
      const pct = best / q.m;
      const attemptsLabel = attempts.length+" attempt"+(attempts.length>1?"s":"");
      if(pct >= 1 || savedInVault){ status="done"; label="Completed · "+attemptsLabel; }
      else if(pct >= 0.75){ status="almost"; label="Almost There · "+attemptsLabel; }
      else { status="review"; label="Needs Review · "+attemptsLabel; }
    }
    return '<div class="qrow" onclick="selectBankQuestion('+idx+')">'+
      '<div class="qnum">'+(idx+1)+'</div>'+
      '<div class="qtext">'+q.t+'<div class="qmeta">'+q.m+' Mark'+(q.m>1?"s":"")+'</div></div>'+
      '<div class="status '+status+'">'+label+'</div>'+
    '</div>';
  }));
  window.__lessonForBank = lesson;
  return '<div class="crumb"><b>'+LEVEL_LABEL[state.level]+'</b> › <b>'+SUBJECT_META[state.subjectKey].name+'</b> › <b>'+lesson.title+'</b></div>'+
  '<div class="qpanel"><div>✏️ <b>Practice a question of your choice</b><div class="qmeta" style="margin-top:2px;">Type or paste your own question to begin</div></div>'+
  '<button class="btn btn-outline" onclick="goto(\'customQ\')">Start Writing</button></div>'+
  '<div class="card"><h2 style="margin-top:0;color:var(--ink);">'+lesson.title+'</h2><div class="qmeta" style="margin-bottom:10px;">'+lesson.questions.length+' practice questions</div>'+rows.join("")+'</div>';
}

// same lesson for momentum. Falls back to the question list if there's no next question
// (last question in the lesson) or if this was a custom (self-authored) question.
function goToNextQuestion(){
  const q = state.currentQuestion;
  const lesson = window.__lessonForBank;
  if(!q.custom && lesson && lesson.questions){
    const idx = parseInt(q.id, 10);
    if(!isNaN(idx) && idx+1 < lesson.questions.length){
      return selectBankQuestion(idx+1);
    }
  }
  goto("qbank");
}
function selectBankQuestion(idx){
  const lesson = window.__lessonForBank;

}

      '<div class="row">'+
        '<button class="btn btn-ghost" onclick="goto(\'qbank\')">Back to Questions</button>'+
        '<button class="btn btn-ghost" onclick="goto(\'subject\')">Change Subject</button>'+
      '</div>'+
      '<button class="btn btn-primary" id="reviewBtn" onclick="submitAnswer()"'+(state.loading?' disabled':'')+'>'+(state.loading? loadingLabel:"Review My Answer")+'</button>'+
    '</div>'+
    (state.loading? '<div class="loading"><div class="spinner"></div>'+(willThink?"Thinking together…":"Ethixo is reading your answer…")+'</div>':"")+
  '</div>';

async function submitAnswer(){
  if(state.loading) return; // double-submit protection: ignore repeated clicks while a request is pending
  const box = document.getElementById("answerBox");
  const ans = box.value.trim();
  if(!ans){ toast("Write an answer first"); return; }
  state.answerDraft = ans; state.error = null;

  const q = state.currentQuestion;
  if(q.custom || !q.a){
    // Custom (self-authored) questions have no confidential model answer to ground a
    // Thinking Cycle on — Phase 1 scope is bank questions only. Unchanged existing flow.
    return submitAnswerDirect(ans);
  }

  // Bank question -> start the Thinking Cycle (Phase 1, api/thinking.js), Turn 1.
  state.thinkingTurn = 1;
  state.thinkingHistory = [];
  state.thinkingHistoryQid = qKey(q);
  state.questionDemand = null;
  state.usedClarification = false;
  state.awaitingFinalAnswer = false;
  state.thinkingDraft = "";
  state.loading = true; render();
  const myRequestId = ++requestSeq;
  try{
    const result = await callThinkingTurn(ans);
    if(myRequestId !== requestSeq) return; // user navigated away — drop this stale response
    state.loading = false;
    await handleThinkingResult(ans, result);
  }catch(e){
    if(myRequestId !== requestSeq) return;
    state.loading = false; state.error = "Couldn't reach Ethixo's thinking coach right now. ("+e.message+")"; render();
  }
}

async function submitAnswerDirect(ans){
  state.loading = true; state.error=null; render();
  const myRequestId = ++requestSeq;
  try{
    const q = state.currentQuestion;
    const priorAttempts = (await sGet(qKey(q))) || [];
    // Only trust state.thinkingHistory as Learning Receipt evidence if it was actually built
    // for THIS question (guards against a previous question's Thinking Cycle history leaking
    // in as false evidence — see milestone report).
    const thinkingEvidence = (state.thinkingHistoryQid === qKey(q)) ? state.thinkingHistory : [];
    const fb = await getAIFeedback(q.t, q.m, ans, q.a, thinkingEvidence, priorAttempts);
    if(myRequestId !== requestSeq) return; // user navigated away — drop this stale response
    state.loading=false;
    if(fb.languageError){
      state.error = fb.message || "Please write your answer in English.";
      render();
      return;
    }
    state.feedback = fb;
    priorAttempts.push({ answer:ans, score:fb.score, strengths:fb.strengths, nextSteps:fb.nextSteps, usedThinking: thinkingEvidence.length>0, at:Date.now() });
    await sSet(qKey(q), priorAttempts);
    if(myRequestId !== requestSeq) return; // re-check: navigation could have happened during the sSet await too
    // Thinking Cycle evidence has now been consumed (or was never relevant) — clear it so it
    // can never be mistaken for evidence belonging to a different question later.
    state.thinkingHistory = []; state.thinkingHistoryQid = null; state.thinkingTurn = 0;
    state.usedClarification = false; state.awaitingFinalAnswer = false; state.thinkingDraft = ""; state.improveDraft = "";
    goto("feedback");
  }catch(e){
    if(myRequestId !== requestSeq) return;
    state.loading=false; state.error="Couldn't reach Ethixo's AI coach right now. ("+e.message+")"; render();
  }
}

/* ---- Thinking Cycle (Phase 1, bank questions only) ---- */
async function callThinkingTurn(studentResponse){
  const q = state.currentQuestion;
  const res = await fetch("/api/thinking", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      question: q.t, marks: q.m, modelAnswer: q.a,
      turnNumber: state.thinkingTurn,
      questionDemand: state.questionDemand,
      conversationHistory: state.thinkingHistory,
      studentResponse: studentResponse
    })
  });
  const data = await res.json();
  if(!res.ok){ throw new Error(data.error || ("Server error "+res.status)); }
  return data;
}

async function handleThinkingResult(studentResponse, result){
  if(result.questionDemand && result.questionDemand.length){ state.questionDemand = result.questionDemand; }
  state.thinkingHistory.push({speaker:"student", text: studentResponse});

  if(result.responseGate !== "Sufficient"){
    // Partial or Insufficient — per frozen spec: one reflective clarification is allowed,
    // consuming the current turn; if the NEXT response is still not Sufficient, exit
    // without a Learning Gap diagnosis (Phase 1 assumption: Insufficient follows the same
    // one-chance rule as Partial — flagged in the Milestone 1 report).
    if(state.usedClarification){
      return submitAnswerDirect(studentResponse);
    }
    state.usedClarification = true;
    state.thinkingHistory.push({speaker:"ethixo", text: result.message});
    state.thinkingTurn += 1;
    goto("thinking");
    return;
  }

  if(result.noThinkingCycle){
    // Sufficient evidence, but no genuine thinking gap (e.g. a pure factual-recall miss) —
    // grade their original attempt directly, no forced Socratic back-and-forth for something
    // that's a knowledge gap, not a thinking gap.
    return submitAnswerDirect(studentResponse);
  }

  state.thinkingHistory.push({speaker:"ethixo", text: result.message});
  const shouldExit = result.resolved === true || state.thinkingTurn >= 3;
  if(shouldExit){
    // IMPORTANT: don't silently grade the reply that just triggered this — the student never
    // gets to read Ethixo's final message that way (real testing caught this: the screen
    // changed before they could read it). Show that message on this same chat screen, and
    // wait for the student's OWN next input — informed by what Ethixo just said — before
    // moving on to grading. Still no separate Rewrite page, still no duplicate-submit-of-
    // the-same-text — just one genuine final message from the student on this same screen.
    state.awaitingFinalAnswer = true;
    goto("thinking");
  } else {
    state.thinkingTurn += 1;
    goto("thinking");
  }
}

function viewThinking(){
  const q = state.currentQuestion;
  const finalMode = state.awaitingFinalAnswer;
  const history = state.thinkingHistory.map(function(turn){
    return '<div class="bubble '+(turn.speaker==="ethixo"?"ethixo":"student")+'">'+turn.text+'</div>';
  }).join("");
  return '<div class="crumb"><b>'+LEVEL_LABEL[q.level]+'</b> › <b>'+SUBJECT_META[q.subjectKey].name+'</b> › <b>'+q.lessonTitle+'</b></div>'+

    '<p class="turnbadge">'+q.m+' Mark'+(q.m>1?"s":"")+' · '+(finalMode? 'Write your final answer below' : 'Thinking Turn '+state.thinkingTurn+' of 3')+'</p>'+
    '<p style="font-weight:700;color:var(--ink);font-size:15px;margin-top:8px;">'+q.t+'</p>'+
    '<div class="chatlog">'+history+'</div>'+

    '<textarea id="thinkingBox" placeholder="'+(finalMode? 'Type your final answer here…' : 'Type your response here…')+'" oninput="state.thinkingDraft=this.value">'+(state.thinkingDraft||"")+'</textarea>'+
    (state.error? '<div class="errbox">'+state.error+'</div>':"")+
    '<div class="row between" style="margin-top:18px;">'+
      '<div class="row">'+
        '<button class="btn btn-ghost" onclick="goto(\'qbank\')">Back to Questions</button>'+
        '<button class="btn btn-ghost" onclick="goto(\'subject\')">Change Subject</button>'+
      '</div>'+
      '<button class="btn btn-primary" onclick="submitThinkingReply()"'+(state.loading?' disabled':'')+'>'+(state.loading?(finalMode?"Submitting…":"Thinking together…"):(finalMode?"Submit Final Answer":"Send"))+'</button>'+
    '</div>'+
    (state.loading? '<div class="loading"><div class="spinner"></div>'+(finalMode?"Ethixo is reading your final answer…":"Thinking together…")+'</div>':"")+
  '</div>';
}
async function submitThinkingReply(){
  if(state.loading) return; // double-submit protection
  const box = document.getElementById("thinkingBox");
  const reply = box.value.trim();
  if(!reply){ toast("Type a response first"); return; }
  state.thinkingDraft = reply; // save immediately — if the request fails below, this stays in the box
  if(state.awaitingFinalAnswer){
    // Turns are exhausted (or resolved) and the student has now read Ethixo's last message —
    // this reply is their real final answer. Grade it directly, no further thinking.js call.
    state.answerDraft = reply;
    return submitAnswerDirect(reply);
  }
  state.loading = true; state.error = null; render();
  const myRequestId = ++requestSeq;
  try{
    const result = await callThinkingTurn(reply);
    if(myRequestId !== requestSeq) return; // user navigated away — drop this stale response
    state.loading = false;
    state.thinkingDraft = ""; // this reply has been handled — next turn starts with a blank box
    await handleThinkingResult(reply, result);
  }catch(e){
    if(myRequestId !== requestSeq) return;
    state.loading = false; state.error = "Couldn't reach Ethixo's thinking coach right now. ("+e.message+")"; render();
  }
}


/* ---- Feedback ---- */
function viewFeedback(){
  const q = state.currentQuestion, fb = state.feedback;
  const pct = fb.score / q.m;
  const isComplete = fb.score >= q.m; // full marks = the question is considered complete, not "still improvable"
  const saveBtn = (pct >= 0.75)
    ? '<button class="btn btn-outline" onclick="addToVault()">⭐ Add to ScholarVault</button>'
    : '<span class="qmeta" style="align-self:center;">Score 75%+ to save to ScholarVault</span>';

  // Full marks: no "Next Steps" (there is nothing left to strengthen), and no invitation back
  // into another improvement loop — a clear completion banner replaces it instead.
  const nextStepsOrCompletionBlock = isComplete
    ? '<div class="completion-block"><h3>🎉 Full Marks — Question Completed!</h3><p>You wrote a complete, well-reasoned answer. Nice work.</p></div>'
    : '<div class="fb-block"><h4>↗ Next Steps to Strengthen Your Answer</h4><ul class="fb-list next">'+fb.nextSteps.map(s=>'<li>'+s+'</li>').join("")+'</ul></div>';

  const actionButtons = isComplete
    ? '<div class="row">'+

        '<button class="btn btn-primary" onclick="goToNextQuestion()">Next Question →</button>'+
      '</div>'
    : '<div class="row">'+
        saveBtn+
        '<button class="btn btn-primary" onclick="goto(\'improve\')">Retry Question</button>'+
      '</div>';

  return '<div class="crumb"><b>'+LEVEL_LABEL[q.level]+'</b> › <b>'+SUBJECT_META[q.subjectKey].name+'</b> › <b>'+q.lessonTitle+'</b></div>'+
  '<div class="card">'+
    '<h1 class="title">Your Performance Feedback</h1>'+
    '<p style="font-weight:700;color:var(--ink);">'+q.t+'</p>'+
    '<div class="gaugewrap">'+
      '<svg width="120" height="70" viewBox="0 0 120 70" id="gaugeSvg">'+
        '<path d="M10,65 A50,50 0 0 1 110,65" fill="none" stroke="#e2e5e2" stroke-width="10" stroke-linecap="round"/>'+
        '<path id="gaugeArc" d="M10,65 A50,50 0 0 1 110,65" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round"/>'+
        '<defs><linearGradient id="gg" x1="0" y1="0" x2="120" y2="0"><stop offset="0" stop-color="#00A86B"/><stop offset="1" stop-color="#046B4A"/></linearGradient></defs>'+
      '</svg>'+
      '<div class="scoretext">Estimated Score<br><b>'+fb.score+' / '+q.m+'</b> Marks</div>'+
    '</div>'+
    '<div class="fb-block"><h4>✅ Strengths</h4><ul class="fb-list ok">'+fb.strengths.map(s=>'<li>'+s+'</li>').join("")+'</ul></div>'+
    nextStepsOrCompletionBlock+
    ((fb.learningReceipt && fb.learningReceipt.length) ?
      '<hr class="receipt-divider">'+
      '<div class="receipt-block"><h4>🌱 Today\'s Learning</h4><ul class="receipt-list">'+fb.learningReceipt.map(s=>'<li>'+s+'</li>').join("")+'</ul></div>'
      : "")+
    '<div class="row between" style="margin-top:24px;">'+
      '<div class="row">'+
        '<button class="btn btn-ghost" onclick="goto(\'qbank\')">Back to Questions</button>'+
        '<button class="btn btn-ghost" onclick="goto(\'subject\')">Change Subject</button>'+
      '</div>'+
      actionButtons+
    '</div>'+

}
function drawGaugeIfPresent(){
  const arc = document.getElementById("gaugeArc");
  if(!arc || !state.feedback) return;
  const q = state.currentQuestion, fb = state.feedback;
  const frac = Math.max(0, Math.min(1, fb.score / q.m));
  const len = 3.14159*50;
  arc.setAttribute("stroke-dasharray", (len*frac)+","+len);
}
async function addToVault(){
  const q = state.currentQuestion, fb = state.feedback;
  const pct = fb.score / q.m;
  if(pct < 0.75){ toast("Score 75%+ needed to save to ScholarVault"); return; }
  if(pct < 0.90){
    const ok = confirm("You're doing well! You could try to improve this further before saving.\n\nSave this as your final answer anyway?");
    if(!ok) return;
  }
  await loadVault();
  const item = { qid:qKey(q), level:q.level, subjectKey:q.subjectKey, lessonTitle:q.lessonTitle, t:q.t, m:q.m, answer:state.answerDraft, score:fb.score, savedAt:Date.now() };
  state.vault = state.vault.filter(v=>v.qid!==item.qid);
  state.vault.push(item);
  await sSet("vault", state.vault);
  toast("Saved to ScholarVault ⭐");
}

async function viewImprove(){
  const q = state.currentQuestion;
  const attempts = (await sGet(qKey(q))) || [];
  const best = attempts.reduce((a,b)=> (attemptScore(b)>(a?attemptScore(a):-1)? b:a), null);
  const hist = attempts.map((a,i)=>'<div class="hattempt"><span>Attempt '+(i+1)+(i===attempts.length-1?" (Latest)":"")+'</span><span>'+attemptScore(a)+'/'+q.m+'</span></div>').join("");
  return '<div class="crumb"><b>'+LEVEL_LABEL[q.level]+'</b> › <b>'+SUBJECT_META[q.subjectKey].name+'</b> › <b>'+q.lessonTitle+'</b></div>'+
  '<div class="card">'+
    '<h1 class="title">Improve Your Answer</h1>'+
    '<p class="qmeta">Attempts: '+attempts.length+' '+(best? "| Best: "+attemptScore(best)+"/"+q.m:"")+'</p>'+
    '<p style="font-weight:700;color:var(--ink);">'+q.t+'</p>'+
    '<div class="history">'+(hist || '<span class="qmeta">No attempts yet</span>')+'</div>'+

    privacyNote()+
    '<textarea id="improveBox" placeholder="Type your answer here (in English)…" oninput="state.improveDraft=this.value">'+(state.improveDraft||"")+'</textarea>'+
    (state.error? '<div class="errbox">'+state.error+'</div>':"")+
    '<div class="row between" style="margin-top:18px;">'+
      '<div class="row">'+
        '<button class="btn btn-ghost" onclick="goto(\'qbank\')">Back to Questions</button>'+
        '<button class="btn btn-ghost" onclick="goto(\'subject\')">Change Subject</button>'+
      '</div>'+
      '<button class="btn btn-primary" onclick="submitImprove()"'+(state.loading?' disabled':'')+'>'+(state.loading?"Reviewing…":"Submit My New Answer")+'</button>'+
    '</div>'+
    (state.loading? '<div class="loading"><div class="spinner"></div>Ethixo is reading your answer…</div>':"")+
  '</div>';
}
async function submitImprove(){
  if(state.loading) return; // double-submit protection
  const box = document.getElementById("improveBox");
  const ans = box.value.trim();
  if(!ans){ toast("Write an answer first"); return; }
  state.improveDraft = ans; // save immediately — preserved in the box if the request below fails
  state.loading=true; state.error=null; render();
  const myRequestId = ++requestSeq;
  try{
    const q = state.currentQuestion;
    const priorAttempts = (await sGet(qKey(q))) || [];
    const fb = await getAIFeedback(q.t, q.m, ans, q.a, [], priorAttempts);
    if(myRequestId !== requestSeq) return; // user navigated away — drop this stale response
    state.loading=false;
    if(fb.languageError){
      state.error = fb.message || "Please write your answer in English.";
      render();
      return;
    }
    state.feedback = fb; state.answerDraft = ans; state.improveDraft = "";
    priorAttempts.push({ answer:ans, score:fb.score, strengths:fb.strengths, nextSteps:fb.nextSteps, usedThinking:false, at:Date.now() });
    await sSet(qKey(q), priorAttempts);
    if(myRequestId !== requestSeq) return;
    goto("feedback");
  }catch(e){
    if(myRequestId !== requestSeq) return;
    state.loading=false; state.error="Couldn't reach Ethixo's AI coach right now. ("+e.message+")"; render();
  }
}

  else state.selectedVaultIds = state.selectedVaultIds.filter(x=>x!==qid);

function viewPrint(){
  const items = state.selectedVaultIds.length? state.vault.filter(v=>state.selectedVaultIds.includes(v.qid)) : state.vault;
  const rows = items.map(v=>'<div style="margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid #ddd;">'+

    '</div>'+
    '<h1 class="title">Ethixo Revision Notes</h1>'+
    '<p class="sub">Generated '+new Date().toLocaleDateString()+'</p>'+
    (rows || '<p class="qmeta">No answers selected.</p>')+

function downloadPDF(){
  const items = state.selectedVaultIds.length? state.vault.filter(v=>state.selectedVaultIds.includes(v.qid)) : state.vault;
  if(!items.length){ toast("No answers to export"); return; }
  if(!window.jspdf){ toast("PDF library failed to load"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const marginX = 48, pageW = doc.internal.pageSize.getWidth()-96, pageH = doc.internal.pageSize.getHeight();
  let y = 60;
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(0,168,107);
  doc.text("Ethixo Revision Notes", marginX, y); y+=16;
  doc.setDrawColor(0,168,107); doc.setLineWidth(2); doc.line(marginX,y,marginX+120,y); y+=22;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110,110,110);
  doc.text("Generated "+new Date().toLocaleDateString(), marginX, y); y+=28;

  items.forEach((v,i)=>{
    if(y > pageH-120){ doc.addPage(); y=60; }
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(24,36,32);
    const qLines = doc.splitTextToSize((i+1)+". "+v.t+"  ("+v.m+" Marks)", pageW);
    doc.text(qLines, marginX, y); y += qLines.length*15 + 4;

    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(60,70,66);
    const aLines = doc.splitTextToSize(v.answer, pageW);
    if(y + aLines.length*13 > pageH-70){ doc.addPage(); y=60; }
    doc.text(aLines, marginX, y); y += aLines.length*13 + 8;

    doc.setFontSize(9); doc.setTextColor(140,140,140);
    doc.text("Estimated score: "+attemptScore(v)+"/"+v.m, marginX, y); y += 26;
  });
  doc.save("Ethixo-Revision-Notes.pdf");
  toast("PDF downloaded ⬇");
}

// Has this student attempted ANY question yet on this device? Drives the empty/first-visit
// state so a brand-new student never sees fabricated "12 misunderstandings corrected".
function hasAnyActivity(){
  for(const level of Object.keys(LEVELS)){
    for(const subjKey of Object.keys(LEVELS[level])){
      const subj = LEVELS[level][subjKey];
      for(const ch of subj.chapters){
        if(ch.locked) continue;
        for(const l of ch.lessons){
          for(let idx=0; idx<l.questions.length; idx++){
            const key = "attempts:"+level+":"+subjKey+":"+l.id+":"+idx;
            if((sGet(key)||[]).length) return true;
          }
        }
      }
    }
  }
  return false;
}

// Flattens every attempted question across all unlocked levels/subjects/chapters into one
// list, using the SAME storage keys as hasAnyActivity() above — no new data source, just a
// richer read of what's already there (score history + timestamps).
function getAllAttemptRecords(){
  const out = [];
  for(const level of Object.keys(LEVELS)){
    for(const subjKey of Object.keys(LEVELS[level])){
      const subj = LEVELS[level][subjKey];
      for(const ch of subj.chapters){
        if(ch.locked) continue;
        let chapterQuestionCount = 0;
        for(const l of ch.lessons){ chapterQuestionCount += l.questions.length; }
        for(const l of ch.lessons){
          for(let idx=0; idx<l.questions.length; idx++){
            const key = "attempts:"+level+":"+subjKey+":"+l.id+":"+idx;
            const attempts = sGet(key) || [];
            if(!attempts.length) continue;
            let latestAt = attempts[0].at || 0;
            attempts.forEach(function(a){ if((a.at||0) > latestAt) latestAt = a.at; });
            out.push({
              level: level, subjectKey: subjKey, chapterId: ch.id, chapterQuestionCount: chapterQuestionCount,
              lessonId: l.id, idx: idx, q: l.questions[idx], attempts: attempts, latestAt: latestAt
            });
          }
        }
      }
    }
  }
  return out;
}

/* ---- Dashboard Hero state selection ----
   Deterministic and state-based only — never random, never a rotating gallery (per the
   Hero image spec). Every condition below reads real stored data (attempts + ScholarVault);
   nothing here is invented or assumed about the student. Priority order (highest first,
   first match wins): Achievement > Mastery > Exam Ready > Confidence > Persistence >
   Thinking > Curiosity > New Concept > Progress > Default.
   Curiosity currently has no honest signal in the data model (see HERO_STATES note above)
   so it is never returned here — that's intentional: a real, lower state is shown instead
   of a fabricated one. Only called when hasAnyActivity() is true (see viewDashboard). */
function pickHeroState(){
  const records = getAllAttemptRecords();
  if(!records.length) return "default";

  let latest = records[0];
  records.forEach(function(r){ if(r.latestAt > latest.latestAt) latest = r; });
  const latestAttempt = latest.attempts[latest.attempts.length-1];

  // 1) Achievement — a meaningful (3+ question) chapter has genuinely just been completed:
  //    every question in it has reached full marks, the attempt that JUST happened is what
  //    finished it, AND at least half the chapter's questions reached full marks within
  //    their first 2 attempts — real evidence of understanding, not just eventual
  //    brute-force completion. If the data can't support that bar, we fall through:
  //    Achievement must be earned, never inferred from completion alone.
  if(attemptScore(latestAttempt) >= latest.q.m){
    const chapterRecords = records.filter(function(r){
      return r.level===latest.level && r.subjectKey===latest.subjectKey && r.chapterId===latest.chapterId;
    });
    const allQuestionsAttempted = chapterRecords.length === latest.chapterQuestionCount;
    const allFullMarks = chapterRecords.every(function(r){
      return Math.max.apply(null, r.attempts.map(attemptScore)) >= r.q.m;
    });
    if(latest.chapterQuestionCount >= 3 && allQuestionsAttempted && allFullMarks){
      const efficientCount = chapterRecords.filter(function(r){
        const firstFullMarksIdx = r.attempts.findIndex(function(a){ return attemptScore(a) >= r.q.m; });
        return firstFullMarksIdx > -1 && firstFullMarksIdx <= 1; // full marks within the first 2 attempts
      }).length;
      if(efficientCount / chapterRecords.length >= 0.5) return "achievement";
    }
  }

  // 2) Mastery — sustained, independent understanding across several DIFFERENT questions:
  //    among the most recently touched questions, at least 3 were full marks on the very
  //    first attempt (no retry, no nudge needed).
  const recentRecords = records.slice().sort(function(a,b){ return b.latestAt - a.latestAt; }).slice(0,6);
  const firstTryMasteryCount = recentRecords.filter(function(r){
    return r.attempts[0] && attemptScore(r.attempts[0]) >= r.q.m;
  }).length;
  if(firstTryMasteryCount >= 3) return "mastery";

  // 3) Exam Ready — real ScholarVault data (already the one field backed by real evidence,
  //    per the Dashboard data provider notes below).
  if(getExamReadyStats().total >= 5) return "examReady";

  // 4) Confidence — the most recent question was answered independently and well on the
  //    very first attempt, no retry needed.
  if(latest.attempts.length===1 && attemptScore(latestAttempt) >= 0.85*latest.q.m) return "confidence";

  // 5) Persistence — the most recent question has taken multiple attempts and still isn't
  //    at full marks: the student is struggling but continuing to try.
  if(latest.attempts.length>=2 && attemptScore(latestAttempt) < latest.q.m) return "persistence";

  // 6) Thinking — the most recent answer was submitted after going through Ethixo's
  //    Thinking Cycle (real, persisted signal — see submitAnswerDirect).
  if(latestAttempt.usedThinking === true) return "thinking";

  // 7) Curiosity — intentionally unreachable; no honest signal exists yet (see HERO_STATES).

  // 8) New Concept — this is the very first attempt ever recorded, on the very first
  //    question touched, in this lesson.
  const lessonRecords = records.filter(function(r){
    return r.level===latest.level && r.subjectKey===latest.subjectKey && r.lessonId===latest.lessonId;
  });
  if(lessonRecords.length===1 && latest.attempts.length===1) return "newConcept";

  // 9) Progress — activity exists but nothing more specific applies.
  return "progress";
}

function getExamReadyStats(){
  const vault = state.vault || [];

  return { total: vault.length, bySubject: bySubject };
}

function getDashboardData(){

function markNoticedSeen(ids){
  const seen = sGet(DASH_SEEN_KEY) || [];
  ids.forEach(function(id){ if(seen.indexOf(id)===-1) seen.push(id); });
  sSet(DASH_SEEN_KEY, seen);
}

  // Exam Ready Answers — this teacher's ONE subject only (Social Studies). The
  // denominator is ASSESSED/submitted written answers for that class, never the
  // Question Bank's total question count — the caption makes this explicit so a
  // teacher can't misread it. Overview shows a per-class breakdown; a specific
  // class shows one clear total. Consistent wording across P6-A/Orchid/Lily.
  function examReadyCell(label, r){
    return '<div class="er-row"><span class="er-icon">'+dicon(TEACHER_PROFILE.subjectIcon,20)+'</span><span class="er-name">'+label+'</span>'+
      '<span class="t-er-counts"><span class="t-er-frac"><b>'+r.examReadyCount+'</b> / '+r.answerCount+'</span><span class="t-er-caption">exam-ready answers</span></span></div>';
  }
  const examReadyHtml = d.isOverview
    ? d.examReadyByClass.map(function(r){ return examReadyCell(r.classLabel, r); }).join("")
    : examReadyCell(d.classLabel, d.examReadyTotal);

  return '<div class="dash-shell">'+
    '<div class="teacher-hero-card">'+
      '<div class="teacher-hero-img-wrap"><img class="teacher-hero-img" src="assets/ethixo_teacher_hero.webp" width="1774" height="887" alt="A warm, sunlit classroom desk with an Ethixo mug, a stack of books, a whiteboard reading &quot;Every Thinker Grows&quot;, and a poster of the Think, Question, Explain, Grow steps." loading="eager" decoding="async"><div class="teacher-hero-scrim"></div></div>'+
      '<div class="teacher-hero-text">'+teacherAvatar(40)+
        '<div class="teacher-hero-copy"><h1>Good morning, Ms. Lim!</h1><p>'+heroSub+'</p></div>'+
      '</div>'+
    '</div>'+
    '<div class="t-workspace-context"><span class="t-workspace-chip">'+dicon(TEACHER_PROFILE.subjectIcon,15)+' '+TEACHER_PROFILE.levelRange+' · '+TEACHER_PROFILE.subject+'</span></div>'+
    '<div class="class-tabs">'+tabs+'</div>'+

    '<h3 class="t-section-title" style="margin-top:0;">This Term\'s Class Progress — '+d.classLabel+'</h3>'+
    '<div class="t-progress-grid">'+progressCards+'</div>'+

    '<div class="noticed-card-refined">'+
      '<div class="noticed-head"><span class="nh-badge">'+dicon('eye',24)+'</span><h3>Ethixo Noticed</h3></div>'+
      '<div class="noticed-list">'+noticedHtml+'</div>'+
    '</div>'+

    '<div class="t-encourage-wrap">'+
      '<h3 class="t-section-title">Students to Encourage</h3>'+
      '<p class="t-encourage-hint">Who may benefit from a little more encouragement right now?</p>'+
      '<div class="t-encourage-grid">'+encourageHtml+'</div>'+
    '</div>'+

    '<div class="t-insights-card">'+
      '<div class="t-head"><span class="t-badge">'+dicon('bulb',24)+'</span><h3>Teaching Insights</h3></div>'+
      '<p class="hint">Most common misconceptions in your '+TEACHER_PROFILE.subject+' classes.</p>'+
      miscHtml+
    '</div>'+

    '<div class="examready-card-refined">'+
      '<div class="er-head"><span class="er-badge">'+dicon('star',24)+'</span><h3>Exam Ready Answers</h3></div>'+
      '<p class="hint">Of the '+TEACHER_PROFILE.subject+' answers assessed so far, how many are exam-ready.</p>'+
      examReadyHtml+
    '</div>'+
  '</div>';
}

/* ---- Teacher: Class Progress Metric Detail — Summary -> Detail -> Learning
   insight. Concept/skill-level information only, never raw answers or Thinking
   Cycle conversations. ---- */
function viewTeacherProgressDetail(){
  const metric = state.teacherProgressMetric;
  const classId = state.teacherClassId || "overview";
  const info = TEACHER_METRIC_DETAIL[metric];
  const d = getTeacherDashboardData(classId);
  if(!info){ return '<div class="card"><p>Not found.</p><button class="btn btn-ghost" onclick="goto(\'teacherDashboard\')">Back to Dashboard</button></div>'; }

  const insight = info.insightByClass[d.isOverview ? "overview" : classId];
  const classIds = d.isOverview ? TEACHER_CLASSES.map(c=>c.id) : [classId];

  let itemsHtml;
  if(metric === "misconceptionsCorrected"){
    itemsHtml = classIds.map(function(id){
      const items = info.itemsByClass[id] || [];
      if(!items.length) return "";
      return items.map(function(it){ return '<div class="detail-item"><b>'+it.title+'</b><span>'+it.note+'</span></div>'; }).join("");
    }).join("");
  } else {
    const allItems = [].concat.apply([], classIds.map(function(id){ return info.itemsByClass[id] || []; }));
    itemsHtml = allItems.map(function(t){ return '<div class="learned-item">'+t+'</div>'; }).join("");
  }

  return '<div class="card">'+
    '<h1 class="title">'+info.label+' — '+d.classLabel+'</h1>'+
    '<div class="t-insight-banner">'+insight+'</div>'+
    itemsHtml+
    '<button class="btn btn-ghost" style="margin-top:20px;" onclick="goto(\'teacherDashboard\')">Back to Dashboard</button>'+
  '</div>';
}

/* ---- Teacher: Student Detail (minimal, per the brief — no raw answers, no
   Thinking Cycle transcripts, no rankings, no permanent ability labels) ---- */
function viewTeacherStudentDetail(){
  const name = state.teacherStudentName;
  const info = TEACHER_STUDENT_DETAIL[name] || { focus:"—", progress:"—", noticed:"No details available yet." };
  return '<div class="card">'+
    '<h1 class="title">'+name+'</h1>'+
    '<div class="t-detail-row"><span class="t-detail-label">Current focus</span><span class="t-detail-val">'+info.focus+'</span></div>'+
    '<div class="t-detail-row"><span class="t-detail-label">Recent progress</span><span class="t-detail-val">'+info.progress+'</span></div>'+
    '<div class="noticed-card-refined" style="margin-top:22px;">'+
      '<div class="noticed-head"><span class="nh-badge">'+dicon('eye',24)+'</span><h3>Ethixo Noticed</h3></div>'+
      '<div class="noticed-list"><div class="noticed-item-refined"><span class="ni-mark">✓</span><span>'+info.noticed+'</span></div></div>'+
    '</div>'+
    '<button class="btn btn-ghost" style="margin-top:22px;" onclick="goto(\'teacherDashboard\')">Back to Dashboard</button>'+
  '</div>';
}

/* ---- misc ---- */
function attachHandlers(){}
window.goto = goto; window.selectBankQuestion = selectBankQuestion; window.startCustom = startCustom;
window.submitAnswer = submitAnswer; window.addToVault = addToVault; window.submitImprove = submitImprove;
window.toggleVaultSel = toggleVaultSel; window.downloadPDF = downloadPDF; window.chooseLevel = chooseLevel; window.state = state;
window.enterAsStudent = enterAsStudent; window.enterAsTeacher = enterAsTeacher; window.switchToTeacher = switchToTeacher; window.switchToStudent = switchToStudent;
window.submitThinkingReply = submitThinkingReply;
window.goToNextQuestion = goToNextQuestion;
window.LEVELS = LEVELS; window.SUBJECT_META = SUBJECT_META; window.LEVEL_LABEL = LEVEL_LABEL;
window.TEACHER_PROFILE = TEACHER_PROFILE; window.TEACHER_CLASSES = TEACHER_CLASSES; window.TEACHER_CLASS_DATA = TEACHER_CLASS_DATA;

(async function init(){
  try{
    await loadVault();

    const prevActive = sGet("lastActive");
    state.lastActiveText = formatLastActive(prevActive);
    sSet("lastActive", Date.now());
    try{ startHeartbeat(); }catch(e){ /* time-tracking is non-critical */ }

    let activePersona = sGet("activePersona");
    const savedLevel = sGet("chosenLevel");
    if(!activePersona && savedLevel){ activePersona = "student"; sSet("activePersona","student"); }

    if(activePersona === "teacher"){
      state.view = "teacherDashboard";
    } else if(activePersona === "student" && savedLevel){
      state.level = savedLevel;
      state.view = "dashboard";
    }

    try{ history.replaceState(stateSnapshot(), "", "#"+state.view); }catch(e){ /* history API unavailable in this context — continue without it */ }
  }catch(e){
    console.error("Ethixo init warning:", e);
  }
  render();
})();
</script>
